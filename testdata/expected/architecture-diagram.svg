<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 482" width="246" height="482" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a5a5a"/></marker></defs><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/><text x="28" y="30" font-size="20" font-weight="700" fill="#1a1a1a">Shipping Widget v1.0.0: An Event-Driven Pipeline on AWS — Architecture</text><g transform="translate(0,46)"><text x="28" y="20" font-size="15" font-weight="600" fill="#333">Webhook publishes to EventBridge, which buffers in SQS, drained by the EC2 worker.</text><rect x="28" y="58" width="190" height="58" rx="8" fill="#ECECEC" stroke="#888888" stroke-width="1.5"/><text x="123" y="87" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Webhook</text><rect x="28" y="146" width="190" height="58" rx="8" fill="#E9DCF3" stroke="#7A3EA6" stroke-width="1.5"/><text x="123" y="175" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">EventBridge</text><text x="123" y="191" font-size="10" fill="#666" text-anchor="middle">messaging</text><rect x="28" y="234" width="190" height="58" rx="8" fill="#E9DCF3" stroke="#7A3EA6" stroke-width="1.5"/><text x="123" y="263" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">SQS</text><text x="123" y="279" font-size="10" fill="#666" text-anchor="middle">messaging</text><rect x="28" y="322" width="190" height="58" rx="8" fill="#FBE7D3" stroke="#D45B07" stroke-width="1.5"/><text x="123" y="351" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Worker</text><text x="123" y="367" font-size="10" fill="#666" text-anchor="middle">compute</text></g></svg>