name: publish-content

# Human-approval gate for a generated release's content. GitHub Environment
# "Required Reviewers" is the ideal gate, but it needs a public repo or a paid
# plan; this repo is private on the free plan, so we implement the equivalent
# with an approval *issue*: this workflow opens it (that is the approval request +
# notification), and publish-content-approve.yml runs the publish when an
# authorized user comments `/approve`. No polling, no inbound webhook to any
# private service.
#
# Triggered after the serverless content pipeline finishes generating + reviewing
# + publishing the suite to S3, by:
#   - repository_dispatch (event_type: content-generated) from the pipeline, or
#   - workflow_dispatch (manual) for testing.

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Repository owner (org/user) the release belongs to.
        required: true
      repo:
        description: Repository name.
        required: true
      tag:
        description: Release tag (e.g. v0.11.0).
        required: true
  repository_dispatch:
    types: [content-generated]

permissions:
  issues: write

concurrency:
  group: publish-content-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  request-approval:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: open approval issue
        run: |
          OWNER="${{ github.event.client_payload.owner || inputs.owner }}"
          REPO="${{ github.event.client_payload.name || github.event.client_payload.repo || inputs.repo }}"
          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          if [ -z "$OWNER" ] || [ -z "$REPO" ] || [ -z "$TAG" ]; then
            echo "::error::owner/repo/tag are required (owner=$OWNER repo=$REPO tag=$TAG)"
            exit 1
          fi

          # Ensure the label exists (ignore "already exists").
          gh label create release-approval --color FBCA04 \
            --description "Awaiting human approval to publish release content" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          # Machine-readable marker lets the approve workflow recover the identity
          # without re-parsing prose. Built with printf to avoid heredoc/YAML
          # indentation pitfalls.
          BODY=$(printf '%s\n' \
            "Release content for **${OWNER}/${REPO} ${TAG}** has been generated, reviewed, and published to S3 and is **awaiting approval**." \
            "" \
            "- Comment \`/approve\` to publish (notify)." \
            "- Comment \`/reject\` to cancel." \
            "" \
            "Only repository owners/collaborators can approve." \
            "" \
            "<!-- release-approval owner=${OWNER} repo=${REPO} tag=${TAG} -->")
          URL=$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Approve release ${OWNER}/${REPO} ${TAG}" \
            --label release-approval \
            --body "$BODY")
          echo "Opened approval issue: $URL"
          echo "## Approval requested" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
