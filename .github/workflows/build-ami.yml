name: build-ami

# Manual, optional: build (or rebuild) the pre-baked worker AMI with Packer and
# print the AMI id. Run it from the Actions tab when runtime dependencies change
# (model, Docker/NVIDIA/Ollama versions, or scripts/ami/provision.sh).
#
# Reuses the deploy OIDC role (secret AWS_DEPLOY_ROLE_ARN); its ec2:* permission
# covers what Packer needs to launch a builder and register an AMI.
#
# It writes the built AMI id to SSM (/blog-gen/worker-ami); deploy.yml reads it
# automatically on its next run. Just redeploy — no variable to set.

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region to build in
        default: us-east-1
      model:
        description: Ollama model to bake
        default: qwen2.5:7b
      enable_gpu:
        description: Bake NVIDIA drivers + toolkit
        type: choice
        default: "true"
        options: ["true", "false"]
      bake_model:
        description: Bake the model into the AMI (larger image, no boot download)
        type: choice
        default: "true"
        options: ["true", "false"]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: install packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer

      - name: build AMI
        run: |
          ARGS="--region ${{ inputs.region }} --model ${{ inputs.model }}"
          [ "${{ inputs.enable_gpu }}" = "false" ] && ARGS="$ARGS --no-gpu"
          [ "${{ inputs.bake_model }}" = "false" ] && ARGS="$ARGS --no-bake-model"
          # shellcheck disable=SC2086
          scripts/build-ami.sh $ARGS

      - name: publish AMI id to SSM
        run: |
          AMI=$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d: -f2)
          echo "AMI_ID=$AMI" >> "$GITHUB_OUTPUT"
          # deploy.yml reads this parameter automatically — no manual variable to set.
          aws ssm put-parameter --name "/blog-gen/worker-ami" --type String \
            --value "$AMI" --overwrite
          {
            echo "## Built AMI"
            echo ""
            echo "\`$AMI\` (${{ inputs.region }}, model \`${{ inputs.model }}\`)"
            echo ""
            echo "Saved to SSM \`/blog-gen/worker-ami\`. The next \`deploy.yml\` run picks it up"
            echo "automatically — just re-run deploy (or merge to main). No variable to set."
          } >> "$GITHUB_STEP_SUMMARY"
