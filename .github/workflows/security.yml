name: security

# On push/PR the scans only run when code, dependencies, infrastructure, or
# security config change — docs-only changes skip the suite. The weekly
# scheduled run scans the whole repo (and full git history for secrets)
# regardless, so nothing goes permanently unscanned.
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "infrastructure/**"
      - ".gitleaks.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "infrastructure/**"
      - ".gitleaks.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 6 * * 1" # weekly full-repo scan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  govulncheck:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  gosec:
    name: static analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      # Gate on high-severity, high-confidence findings.
      - run: gosec -severity high -confidence high -exclude-generated ./...

  gitleaks:
    name: secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: scan
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  iac-scan:
    name: IaC posture (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      # Informational for now: report CloudFormation posture without blocking.
      - run: checkov -d infrastructure --quiet --compact --soft-fail
