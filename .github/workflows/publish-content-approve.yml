name: publish-content-approve

# Runs the publish (notify-only, per current scope) when an authorized reviewer
# comments `/approve` on a `release-approval` issue opened by publish-content.yml.
# `/reject` cancels. This is the "wait for a human" half of the approval gate,
# done event-driven via issue comments so it works on a private/free-plan repo
# (no Environment Required-Reviewers, no polling, no public ingress).

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  decide:
    # Only act on an open approval issue, from an owner/collaborator/member, whose
    # comment is a decision command.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'release-approval') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER') &&
      (startsWith(github.event.comment.body, '/approve') ||
       startsWith(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ACTOR: ${{ github.event.comment.user.login }}
      WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - name: parse release marker
        id: p
        run: |
          LINE=$(printf '%s' "$ISSUE_BODY" | grep -o '<!-- release-approval[^>]*-->' | head -1)
          OWNER=$(printf '%s' "$LINE" | sed -n 's/.*owner=\([^ ]*\).*/\1/p')
          REPO=$(printf '%s' "$LINE" | sed -n 's/.*repo=\([^ ]*\).*/\1/p')
          TAG=$(printf '%s' "$LINE" | sed -n 's/.*tag=\([^ ]*\).*/\1/p')
          {
            echo "owner=$OWNER"
            echo "repo=$REPO"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: reject
        if: startsWith(github.event.comment.body, '/reject')
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "❌ Rejected by @${ACTOR}. Not publishing."
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"

      - name: approve + notify
        if: startsWith(github.event.comment.body, '/approve')
        env:
          OWNER: ${{ steps.p.outputs.owner }}
          REPO: ${{ steps.p.outputs.repo }}
          TAG: ${{ steps.p.outputs.tag }}
        run: |
          MSG="✅ Release approved by @${ACTOR} & published: ${OWNER}/${REPO} ${TAG}"
          echo "$MSG"
          {
            echo "## Approved & published"
            echo "$MSG"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$WEBHOOK_URL" ]; then
            PAYLOAD=$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps({"text": sys.stdin.read()}))')
            curl -sS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK_URL" \
              || echo "::warning::notify webhook POST failed"
          else
            echo "::notice::NOTIFY_WEBHOOK_URL not set; approval recorded in the issue + job summary only."
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "completed"
