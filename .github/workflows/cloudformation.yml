name: cloudformation

# cfn-lint only needs to run when the templates (or this workflow) change, so
# Go-only and docs-only changes no longer spend a runner here.
on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/cloudformation.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/cloudformation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install cfn-lint
        run: pip install cfn-lint

      - name: lint templates
        # Recurse so the reusable modules (infrastructure/modules/**) and examples
        # are linted alongside the top-level stacks.
        run: cfn-lint infrastructure/*.yaml infrastructure/**/*.yaml
