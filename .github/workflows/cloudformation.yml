name: cloudformation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install cfn-lint
        run: pip install cfn-lint

      - name: lint templates
        run: cfn-lint infrastructure/*.yaml
