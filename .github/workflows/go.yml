name: go

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore: *docs_only

# Cancel superseded runs on the same PR/branch (e.g. rapid follow-up pushes or
# force-pushes) so only the latest commit is built. Pushes to main are never
# cancelled, so every merged commit is still fully validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      # These steps call the same scripts the local Git hooks use, so local
      # validation and CI never drift (single source of truth).
      - name: gofmt
        run: scripts/hooks/format.sh --check

      - name: vet / lint
        run: scripts/hooks/lint.sh

      - name: test
        run: GO_TEST_FLAGS="-race -cover" scripts/hooks/tests.sh

      - name: cross-compile lambdas + renderer (linux/arm64)
        run: |
          for fn in registration manual-trigger release-context scheduled-start scheduled-stop idle-stop load-video-scripts publish-video-manifest; do
            echo "building $fn"
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "dist/$fn/bootstrap" "./lambdas/$fn"
          done
          echo "building video-renderer"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/video-renderer/video-renderer ./cmd/video-renderer
          echo "building content-runner"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/content-runner/content-runner ./cmd/content-runner
