name: go

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same PR/branch (e.g. rapid follow-up pushes or
# force-pushes) so only the latest commit is built. Pushes to main are never
# cancelled, so every merged commit is still fully validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      # These steps call the same scripts the local Git hooks use, so local
      # validation and CI never drift (single source of truth).
      - name: gofmt
        run: scripts/hooks/format.sh --check

      - name: vet / lint
        run: scripts/hooks/lint.sh

      - name: test
        run: GO_TEST_FLAGS="-race -cover" scripts/hooks/tests.sh

      - name: cross-compile lambdas (linux/arm64)
        run: |
          for fn in registration webhook-handler manual-trigger scheduled-start scheduled-stop; do
            echo "building $fn"
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "dist/$fn/bootstrap" "./lambdas/$fn"
          done
