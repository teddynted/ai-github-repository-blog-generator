name: deploy

# Deploys the CloudFormation stacks on merge to main. Dormant (skipped, green)
# until opted in: set repo variable DEPLOY_ENABLED=true and provide the OIDC
# role secret and the vars below. See docs/ci-cd.md and docs/deployment.md.
#
# Required to enable:
#   secret AWS_DEPLOY_ROLE_ARN  - IAM role trusting the GitHub OIDC provider
#   var    AWS_REGION           - e.g. us-east-1
#   (ARTIFACTS_BUCKET is derived automatically as blog-gen-artifacts-<account>-<region>,
#    matching bootstrap.yaml — no variable needed.)
#   var    OPERATOR_CIDR        - (optional) SSH source CIDR
#   var    DEPLOY_ENABLED       - "true" to arm this workflow
#   var    INSTANCE_TYPE        - (optional) override the EC2 type; e.g. t3.xlarge for a CPU smoke test
#   var    ENABLE_GPU           - (optional) "false" to run Ollama CPU-only (pairs with INSTANCE_TYPE)
#
# The worker AMI id is read automatically from SSM (/blog-gen/worker-ami, written
# by build-ami.yml); absent => stock-AMI fallback. No variable to set.
#
# Optional email-notification vars (non-secret; the SMTP password is stored in
# Secrets Manager, NOT here):
#   var    NOTIFY_EMAIL_FROM    - from address
#   var    NOTIFY_EMAIL_TO      - comma-separated recipients
#   var    SMTP_USERNAME        - Turbo SMTP account username
#   var    SMTP_HOST            - (optional) defaults to pro.turbo-smtp.com
#   var    NOTIFY_WEBHOOK_URL   - (optional) Slack/webhook URL
#
# SMTP password — choose ONE:
#   secret SMTP_PASSWORD        - (optional) if set, deploy.yml seeds it into the
#                                 Secrets Manager NotificationsSecret each run
#   or set it manually, out-of-band (nothing in GitHub):
#     aws secretsmanager put-secret-value \
#       --secret-id blog-gen/notifications/smtp-password --secret-string '<password>'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: build + package lambdas
        run: |
          # scheduled-start/scheduled-stop back the scheduler.yaml stack, which
          # owns instance power on the fixed daily window (deployed below,
          # wired to the compute stack's InstanceId).
          for fn in registration webhook-handler manual-trigger release-context scheduled-start scheduled-stop idle-stop; do
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "dist/$fn/bootstrap" "./lambdas/$fn"
            (cd "dist/$fn" && zip -j "../$fn.zip" bootstrap)
          done

      - name: build worker (linux/amd64, runs on the EC2 instance)
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/worker/worker ./cmd/worker

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: preflight (auto-prep account + clean stuck stacks)
        run: bash scripts/deploy/preflight.sh

      - name: resolve artifacts bucket
        run: |
          # Derived, not hand-entered: bootstrap.yaml always names it
          # blog-gen-artifacts-<account>-<region>, so compute it to avoid a
          # wrong ARTIFACTS_BUCKET variable pointing at a non-existent bucket.
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "ARTIFACTS_BUCKET=blog-gen-artifacts-${ACCOUNT}-${{ vars.AWS_REGION }}" >> "$GITHUB_ENV"

      - name: upload artifacts (sha-versioned keys)
        run: |
          for fn in registration webhook-handler manual-trigger release-context scheduled-start scheduled-stop idle-stop; do
            aws s3 cp "dist/$fn.zip" "s3://$ARTIFACTS_BUCKET/$SHA/$fn.zip"
          done
          aws s3 cp dist/worker/worker "s3://$ARTIFACTS_BUCKET/$SHA/worker"
          # provision.sh is fetched at boot only on the stock-AMI fallback path.
          aws s3 cp scripts/ami/provision.sh "s3://$ARTIFACTS_BUCKET/$SHA/provision.sh"

      - name: deploy network stack
        run: |
          # SUBNET_AZ places the On-Demand host in a specific AZ (e.g. us-east-1b)
          # when the default AZ is short on the chosen instance type.
          P=""
          [ -n "${{ vars.OPERATOR_CIDR }}" ] && P="$P OperatorCidr=${{ vars.OPERATOR_CIDR }}"
          [ -n "${{ vars.SUBNET_AZ }}" ]     && P="$P AvailabilityZone=${{ vars.SUBNET_AZ }}"
          aws cloudformation deploy \
            --template-file infrastructure/network.yaml \
            --stack-name blog-gen-network \
            --capabilities CAPABILITY_NAMED_IAM \
            ${P:+--parameter-overrides $P}

      - name: deploy serverless stack
        env:
          # Optional GitHub read token for the Release Context Builder (blank
          # works for public repos). Stored as a GitHub *secret*, never a var.
          GITHUB_READ_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}
        run: |
          P="ArtifactsBucket=$ARTIFACTS_BUCKET"
          P="$P RegistrationCodeKey=$SHA/registration.zip"
          P="$P WebhookHandlerCodeKey=$SHA/webhook-handler.zip"
          P="$P ManualTriggerCodeKey=$SHA/manual-trigger.zip"
          P="$P ReleaseContextCodeKey=$SHA/release-context.zip"
          [ -n "$GITHUB_READ_TOKEN" ] && P="$P GitHubReadToken=$GITHUB_READ_TOKEN"
          # shellcheck disable=SC2086
          aws cloudformation deploy \
            --template-file infrastructure/serverless.yaml \
            --stack-name blog-gen-serverless \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides $P

      - name: deploy compute stack
        env:
          NOTIFY_EMAIL_FROM: ${{ vars.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          NOTIFY_WEBHOOK_URL: ${{ vars.NOTIFY_WEBHOOK_URL }}
        run: |
          # Only the non-secret notification settings are passed here. The SMTP
          # password lives in Secrets Manager (NotificationsSecret) — set it once
          # with: aws secretsmanager put-secret-value \
          #   --secret-id blog-gen/notifications/smtp-password --secret-string '<pw>'
          # Fast baked-AMI boot: the AMI id is read from SSM (/blog-gen/worker-ami,
          # written by build-ami.yml). Absent → stock-AMI fallback (provision.sh at
          # boot). Fully automatic — no manual variable.
          # The key pair is managed by the compute stack (AWS::EC2::KeyPair) — no
          # KeyPairName is passed, so CloudFormation always creates/owns it.
          PARAMS="ArtifactsBucket=$ARTIFACTS_BUCKET WorkerCodeKey=$SHA/worker AmiScriptsKey=$SHA/provision.sh"
          # Generated content is published to S3 (durable + inspectable) instead
          # of the instance's ephemeral EBS. The compute stack creates and owns a
          # dedicated content bucket (blog-gen-content-<account>-<region>); set the
          # OUTPUT_S3_BUCKET repo variable only to override with a pre-existing bucket.
          [ -n "${{ vars.OUTPUT_S3_BUCKET }}" ] && PARAMS="$PARAMS OutputS3Bucket=${{ vars.OUTPUT_S3_BUCKET }}"
          # CPU smoke test: set INSTANCE_TYPE (e.g. t3.xlarge) + ENABLE_GPU=false
          # to validate the whole path on cheap, widely-available CPU capacity.
          [ -n "${{ vars.INSTANCE_TYPE }}" ] && PARAMS="$PARAMS InstanceType=${{ vars.INSTANCE_TYPE }}"
          [ -n "${{ vars.ENABLE_GPU }}" ]    && PARAMS="$PARAMS EnableGpu=${{ vars.ENABLE_GPU }}"
          # Optional: Claude-on-Bedrock technical-writer stage. Set the
          # BEDROCK_MODEL_ID repo variable to a Bedrock Claude model id to enable
          # it; leave unset for the zero-paid local writer.
          [ -n "${{ vars.BEDROCK_MODEL_ID }}" ] && PARAMS="$PARAMS BedrockModelId=${{ vars.BEDROCK_MODEL_ID }}"
          # Optional: Anthropic API technical-writer (preferred over Bedrock when the
          # api-key secret holds a key). Set ANTHROPIC_MODEL to pin the model id; the
          # key itself lives only in Secrets Manager, never a repo variable.
          [ -n "${{ vars.ANTHROPIC_MODEL }}" ] && PARAMS="$PARAMS AnthropicModel=${{ vars.ANTHROPIC_MODEL }}"
          # Optional: override the Hybrid AI Routing policy. Use the shell-safe
          # compact form (no quotes/spaces), e.g.
          # claude=blog,architecture,linkedin,x-thread;ollama=seo-metadata,tiktok
          [ -n "${{ vars.AI_ROUTING_RULES }}" ] && PARAMS="$PARAMS AIRoutingRules=${{ vars.AI_ROUTING_RULES }}"
          AMI_ID=$(aws ssm get-parameter --name /blog-gen/worker-ami \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          [ -n "$AMI_ID" ]           && PARAMS="$PARAMS CustomAmi=$AMI_ID"
          [ -n "$NOTIFY_EMAIL_FROM" ] && PARAMS="$PARAMS NotifyEmailFrom=$NOTIFY_EMAIL_FROM"
          [ -n "$NOTIFY_EMAIL_TO" ]   && PARAMS="$PARAMS NotifyEmailTo=$NOTIFY_EMAIL_TO"
          [ -n "$SMTP_USERNAME" ]     && PARAMS="$PARAMS SmtpUsername=$SMTP_USERNAME"
          [ -n "$SMTP_HOST" ]         && PARAMS="$PARAMS SmtpHost=$SMTP_HOST"
          [ -n "$NOTIFY_WEBHOOK_URL" ] && PARAMS="$PARAMS NotifyWebhookUrl=$NOTIFY_WEBHOOK_URL"
          aws cloudformation deploy \
            --template-file infrastructure/compute.yaml \
            --stack-name blog-gen-compute \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides $PARAMS

      - name: deploy scheduler stack (daily power window)
        env:
          # Optional overrides; defaults are Etc/UTC and 18:00-20:00 every day (Mon-Sun)
          # (the scheduler.yaml defaults). Set SCHEDULE_TIMEZONE to run the
          # window in local wall-clock time (e.g. Africa/Johannesburg).
          SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE }}
          # Idle auto-stop (opt-in). Set ENABLE_IDLE_STOP=true to create the idle
          # Lambda + hourly rule; keep IDLE_DRY_RUN=true until logs look right,
          # and set ScheduleState=DISABLED so the fixed StopSchedule stands down.
          ENABLE_IDLE_STOP: ${{ vars.ENABLE_IDLE_STOP }}
          IDLE_MINUTES: ${{ vars.IDLE_MINUTES }}
          IDLE_DRY_RUN: ${{ vars.IDLE_DRY_RUN }}
          IDLE_N8N_URL: ${{ vars.IDLE_N8N_URL }}
          IDLE_OLLAMA_URL: ${{ vars.IDLE_OLLAMA_URL }}
          IDLE_USE_VPC: ${{ vars.IDLE_USE_VPC }}
          IDLE_SUBNET_IDS: ${{ vars.IDLE_SUBNET_IDS }}
          IDLE_SG_IDS: ${{ vars.IDLE_SG_IDS }}
        run: |
          # The scheduler stack owns instance power: it starts the On-Demand host
          # at 18:00 and stops it at 20:00, every day (7 days a week). Wire it to the compute
          # stack's InstanceId so the schedule targets the real host.
          INSTANCE_ID=$(aws cloudformation describe-stacks --stack-name blog-gen-compute \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)
          P="ProjectName=blog-gen InstanceId=$INSTANCE_ID ArtifactsBucket=$ARTIFACTS_BUCKET"
          P="$P StartCodeKey=$SHA/scheduled-start.zip StopCodeKey=$SHA/scheduled-stop.zip"
          P="$P IdleCodeKey=$SHA/idle-stop.zip"
          [ -n "$SCHEDULE_TIMEZONE" ] && P="$P ScheduleTimezone=$SCHEDULE_TIMEZONE"
          # Idle auto-stop is opt-in via repo vars; unset leaves EnableIdleStop=false
          # (the template default), so the idle Lambda/rule are not created.
          [ -n "$ENABLE_IDLE_STOP" ] && P="$P EnableIdleStop=$ENABLE_IDLE_STOP"
          [ -n "$IDLE_MINUTES" ]     && P="$P IdleMinutes=$IDLE_MINUTES"
          [ -n "$IDLE_DRY_RUN" ]     && P="$P IdleDryRun=$IDLE_DRY_RUN"
          [ -n "$IDLE_N8N_URL" ]     && P="$P N8nUrl=$IDLE_N8N_URL"
          [ -n "$IDLE_OLLAMA_URL" ]  && P="$P OllamaUrl=$IDLE_OLLAMA_URL"
          [ -n "$IDLE_USE_VPC" ]     && P="$P IdleUseVpc=$IDLE_USE_VPC"
          [ -n "$IDLE_SUBNET_IDS" ]  && P="$P IdleSubnetIds=$IDLE_SUBNET_IDS"
          [ -n "$IDLE_SG_IDS" ]      && P="$P IdleSecurityGroupIds=$IDLE_SG_IDS"
          aws cloudformation deploy \
            --template-file infrastructure/scheduler.yaml \
            --stack-name blog-gen-scheduler \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides $P

      - name: seed SMTP password into Secrets Manager (optional)
        env:
          # A GitHub *secret* (encrypted, masked in logs) — not a var. Leave it
          # unset to keep managing the password manually via put-secret-value.
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "SMTP_PASSWORD secret not set; leaving the Secrets Manager value as-is."
            exit 0
          fi
          ARN=$(aws cloudformation describe-stacks --stack-name blog-gen-compute \
            --query "Stacks[0].Outputs[?OutputKey=='NotificationsSecretArn'].OutputValue" --output text)
          aws secretsmanager put-secret-value --secret-id "$ARN" --secret-string "$SMTP_PASSWORD" >/dev/null
          echo "SMTP password updated in $ARN"

      - name: deploy observability stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/observability.yaml \
            --stack-name blog-gen-observability \
            --capabilities CAPABILITY_NAMED_IAM
