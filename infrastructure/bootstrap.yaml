AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub AI Blog Generator - Bootstrap stack (deployed once, by an admin, before
  the deploy workflow can run). Creates the Lambda artifacts S3 bucket, the
  GitHub Actions OIDC provider (optional), and the least-privilege-ish IAM role
  that the deploy.yml workflow assumes via OIDC to deploy the application stacks.

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix.
  GitHubOwner:
    Type: String
    Default: teddynted
    Description: GitHub org/user that owns the repository.
  GitHubRepo:
    Type: String
    Default: ai-github-repository-blog-generator
    Description: Repository name allowed to assume the deploy role.
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Create the GitHub Actions OIDC provider. Set to "false" if the account
      already has one (an account may only have a single provider per URL).
  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: ARN of the existing OIDC provider (used when CreateOIDCProvider=false).

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Customer-managed KMS key for the generated-content bucket (SSE-KMS). A CMK
  # (vs SSE-S3) gives key-level access control and CloudTrail visibility of key
  # use. The key policy delegates to IAM (account root), so principals are
  # granted use through their own IAM policies — no cross-stack role references.
  ContentBucketKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "SSE-KMS for ${ProjectName} generated content"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  ContentBucketKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-content"
      TargetKeyId: !Ref ContentBucketKey

  # Dedicated bucket for generated content (blog, release-summary, …), kept
  # separate from the CI artifacts bucket so it carries its own retention. The
  # worker (compute stack) publishes here under OUTPUT_S3_PREFIX (default
  # generated-content/). Created here rather than in the compute stack because
  # the deploy role is not granted s3:CreateBucket; the name is deterministic so
  # the compute stack references it without a cross-stack import.
  #
  # Versioning is enabled so every generation is immutable and re-runs of the
  # same release tag never destroy prior output (they create a new object
  # version), which is the backbone for history, comparison, and rollback.
  ContentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt ContentBucketKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Reclaim storage from abandoned multipart uploads (relevant once large
          # binary artifacts — video/audio/png — are published).
          - Id: abort-incomplete-mpu
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Bound the audit window: expire superseded (noncurrent) versions after
          # a year, but always keep at least the 20 most recent generations of an
          # object regardless of age.
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
              NewerNoncurrentVersions: 20
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Enforce TLS-only access to the content bucket (parity with the artifacts
  # bucket). The worker/SDK already uses HTTPS, so this only blocks plaintext.
  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ContentBucket.Arn
              - !Sub "${ContentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Operator role for the content-admin CLI (history / compare / rollback /
  # promote-latest). It can READ and COPY content — deliberately separate from
  # the worker, which stays write-only. Trusts the account root so an admin can
  # delegate assume-role; scope it to specific principals in production.
  ContentOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-content-operator"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: content-admin
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadWriteContentObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ContentBucket.Arn}/*"
              - Sid: ListContentVersions
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt ContentBucket.Arn
              - Sid: UseContentKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt ContentBucketKey.Arn

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub "${ArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-deploy"
      Description: Assumed by GitHub Actions (OIDC) to deploy the application stacks.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:*"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # NOTE: a CloudFormation deploy role that provisions arbitrary
              # infrastructure is necessarily broad. It is scoped to the services
              # the four stacks use; tighten further for your org if required.
              - Sid: CloudFormation
                Effect: Allow
                Action: cloudformation:*
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: CoreServices
                Effect: Allow
                Action:
                  - ec2:*
                  - lambda:*
                  - apigateway:*
                  - events:*
                  # EventBridge Scheduler (scheduler.yaml) is a distinct service
                  # from EventBridge (events:*) — the daily start/stop schedules.
                  - scheduler:*
                  - sqs:*
                  - dynamodb:*
                  - logs:*
                  - cloudwatch:*
                  - sns:*
                Resource: "*"
              # Manage the NotificationsSecret (compute stack) and let deploy.yml
              # seed the SMTP password. Scoped to this project's secrets.
              - Sid: SecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:${ProjectName}/*"
              # GetRandomPassword (used by GenerateSecretString) cannot be scoped.
              - Sid: SecretsManagerRandom
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: "*"
              # Read/write the project's SSM parameters — the worker AMI id
              # (build-ami.yml writes it, deploy.yml reads it).
              - Sid: SsmProjectParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                Resource: !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/${ProjectName}/*"
              # Manage the private key of a stack-created AWS::EC2::KeyPair, which
              # EC2 stores under /ec2/keypair/<key-pair-id>.
              - Sid: SsmKeyPairParameters
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/ec2/keypair/*"
              # Resolve public AWS-managed parameters (e.g. the base Ubuntu AMI
              # that compute.yaml's LatestUbuntuAmi points at).
              - Sid: SsmPublicParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:*::parameter/aws/service/*"
              - Sid: IAMForStacks
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*"
              # (The On-Demand compute host needs no Spot service-linked role.)

Outputs:
  ArtifactsBucketName:
    Description: Set this as the ARTIFACTS_BUCKET repository variable.
    Value: !Ref ArtifactsBucket
  ContentBucketName:
    Description: Dedicated bucket the worker publishes generated content to.
    Value: !Ref ContentBucket
  ContentBucketKeyArn:
    Description: KMS key ARN encrypting the generated-content bucket.
    Value: !GetAtt ContentBucketKey.Arn
    Export:
      Name: !Sub "${ProjectName}-content-bucket-key-arn"
  ContentOperatorRoleArn:
    Description: Assume this role to run the content-admin CLI (read/rollback).
    Value: !GetAtt ContentOperatorRole.Arn
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repository secret.
    Value: !GetAtt DeployRole.Arn
  OIDCProviderArn:
    Description: The GitHub Actions OIDC provider ARN.
    Value: !If [ShouldCreateProvider, !Ref GitHubOIDCProvider, !Ref ExistingOIDCProviderArn]
