AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub AI Blog Generator - Compute stack. A small On-Demand EC2 instance
  (Ubuntu, arm64/Graviton) that runs the orchestration plane — n8n + PostgreSQL
  + Redis via Docker Compose — plus the content generator, which calls Claude on
  Amazon Bedrock (falling back to the Anthropic API); there is NO local model
  inference or GPU. A persistent gp3 EBS volume survives start/stop cycles (n8n
  state + Repository Memory). The Step Functions state machine in the serverless
  stack starts this instance on demand, waits for it to report ready via SSM,
  hands the release job to the SQS queue the worker drains, and stops it again.
  Imports the subnet and security group from the network stack and the SQS queue
  from the serverless stack.

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix and tag value (must match the other stacks).
  InstanceType:
    Type: String
    Default: t4g.small
    Description: >
      EC2 instance type for the On-Demand instance. Defaults to t4g.small
      (arm64/Graviton) — the box only runs n8n + PostgreSQL + Redis and the
      generator's API calls, so no GPU or large compute is needed. Must be an
      arm64 type to match the Graviton base AMI (LatestUbuntuAmi).
  KeyPairName:
    Type: String
    Default: ""
    Description: >
      Existing EC2 key pair name to use for SSH. Leave blank and the stack
      creates and manages one (named <project>-key); its private key is stored in
      SSM Parameter Store at /ec2/keypair/<key-pair-id>.
  EbsVolumeSizeGb:
    Type: Number
    Default: 20
    MinValue: 20
    Description: Size of the persistent gp3 volume (n8n + PostgreSQL state + Repository Memory).
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/arm64/hvm/ebs-gp2/ami-id
    Description: Base AMI (latest Ubuntu 22.04 arm64/Graviton) — matches the t4g instance family.
  OutputS3Bucket:
    Type: String
    Default: ""
    Description: >
      Optional override: publish generated content to this pre-existing S3
      bucket instead of the dedicated content bucket created by the bootstrap
      stack (<project>-content-<account>-<region>). When set, the instance role
      is granted s3:PutObject on it. Leave blank for the normal case.


Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  # No external key supplied → the stack creates and manages one.
  ManageKeyPair: !Equals [!Ref KeyPairName, ""]
  HasOutputBucket: !Not [!Equals [!Ref OutputS3Bucket, ""]]

Resources:
  # Container for the SMTP password. CFN creates it with a random placeholder;
  # the operator sets the real Turbo SMTP password out-of-band (put-secret-value)
  # so it never appears in the template or parameter history. Subsequent stack
  # updates leave the value untouched.
  NotificationsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/notifications/smtp-password"
      Description: SMTP password for Turbo SMTP email notifications (set the real value with put-secret-value).
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  # Container for the Anthropic API key (technical-writer stage). CFN creates it
  # with a random placeholder; set the real key out-of-band with put-secret-value
  # so it never appears in the template or parameter history. Empty/placeholder =
  # the writer stays on the local model. Subsequent stack updates leave it intact.
  AnthropicApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/anthropic/api-key"
      Description: Anthropic API key for the Claude technical-writer (set the real value with put-secret-value).
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  # Created only when no external KeyPairName is supplied. CloudFormation/EC2
  # generates the key pair and stores the private key in SSM Parameter Store at
  # /ec2/keypair/<key-pair-id> (SecureString) — retrieve it with get-parameter.
  ManagedKeyPair:
    Type: AWS::EC2::KeyPair
    Condition: ManageKeyPair
    Properties:
      KeyName: !Sub "${ProjectName}-key"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Register as an SSM managed instance so the Step Functions state machine
      # can gate on DescribeInstanceInformation (instance Online) before handing
      # off the release job. Grants only the SSM agent's core channel — no
      # RunCommand document is invoked by the pipeline.
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Ship logs (n8n/PostgreSQL/Redis boot + health).
              # (Phase B: SQS drain, repo-credentials/SMTP secret reads, and the
              # last-processed-SHA DynamoDB writes were the worker's — removed with
              # the worker; the box now runs only the n8n/PG/Redis compose stack.)
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/instance:*"
              # Publish CPU/mem/disk metrics via the CloudWatch agent (scoped to
              # this project's metric namespace; PutMetricData cannot be resource-scoped).
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: "BlogGen/Instance"
              # Attach the persistent data volume at boot (see UserData). The
              # volume is managed by CloudFormation but attached by the instance
              # itself, so a stack update that replaces the instance never hits
              # the CloudFormation "volume already attached" failure. Scoped to
              # this project's tagged volume + instances; DescribeVolumes cannot
              # be resource-scoped.
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: !Ref ProjectName
              - Effect: Allow
                Action: ec2:DescribeVolumes
                Resource: "*"
              # (Phase B: the content-bucket S3 read/write + SSE-KMS grants and the
              # worker-binary download were the worker's — content generation now
              # runs on Fargate with its own task role; removed here.)
              # Email notifications go through Turbo SMTP (outbound SMTP over
              # TLS), so no AWS mail permission is required — the worker only
              # needs egress on 587/465 and reads the SMTP password from the
              # NotificationsSecret above.

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # A launch template centralizes the instance configuration (type, AMI, key,
  # profile, security group, root volume, user data) so the AWS::EC2::Instance
  # below stays a thin reference. This is an On-Demand instance: there are no
  # InstanceMarketOptions, so a start (from the scheduler stack at 18:00 daily,
  # or a manual maintenance start) always succeeds without depending on
  # Spot capacity at a max price.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-lt"
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref LatestUbuntuAmi
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref ManagedKeyPair]
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-InstanceSecurityGroupId"
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              # Root holds the OS + Docker + the n8n/PostgreSQL/Redis images and
              # the generator binary. No model image/seed anymore, so 20 GB is
              # ample (persistent state lives on the separate /data volume).
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub: |
                #!/bin/bash
                set -euxo pipefail
                # --- Boots the orchestration plane (n8n + PostgreSQL + Redis via
                # --- Docker Compose) and installs the generator worker. No local
                # --- model, GPU, or AMI baking — Claude runs on Bedrock/Anthropic.
                export DEBIAN_FRONTEND=noninteractive
                ARCH=$(dpkg --print-architecture)
                mkdir -p /opt/blog-gen /etc/blog-gen

                # --- Attach the persistent data volume, then mount it at /data.
                # The volume is created by CloudFormation (Retain) but attached
                # HERE at boot — NOT via an AWS::EC2::VolumeAttachment — so a
                # stack update that REPLACES this instance never fails with
                # "volume already attached": CloudFormation terminates the old
                # instance and the volume is then free to (re)attach here. The
                # loop also covers first boot (waits for the volume to exist).
                export AWS_DEFAULT_REGION=${AWS::Region}
                command -v aws >/dev/null 2>&1 || { apt-get update -y && apt-get install -y awscli; }
                TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300" || true)
                imds() { curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/$1" || true; }
                INSTANCE_ID=$(imds instance-id)
                AZ=$(imds placement/availability-zone)

                # --- Observability: ship boot/worker logs + CPU/mem/disk metrics
                # --- to CloudWatch so the box is diagnosable without SSH.
                # --- Installs the agent if the AMI lacks it (idempotent). The
                # --- worker gets a dedicated log stream (systemd drop-in); a 60s
                # --- health probe records readiness. Role grants CreateLogStream
                # --- + PutLogEvents + PutMetricData.
                CW=/opt/aws/amazon-cloudwatch-agent
                if [ ! -x "$CW/bin/amazon-cloudwatch-agent-ctl" ]; then
                  ARCH=$(dpkg --print-architecture)
                  curl -fsSL "https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/$ARCH/latest/amazon-cloudwatch-agent.deb" -o /tmp/cwagent.deb \
                    && dpkg -i -E /tmp/cwagent.deb || true
                  rm -f /tmp/cwagent.deb
                fi
                mkdir -p "$CW/etc" /var/log/blog-gen

                # (Phase B) The worker log drop-in is gone with the worker.

                # 60s health probe -> its own stream (READY / UNHEALTHY: <reason>).
                cat > /usr/local/bin/blog-gen-health-log.sh <<'HSH'
                #!/usr/bin/env bash
                out=$(/opt/blog-gen/health.sh 2>&1) || true
                echo "$(date -u +%FT%TZ) $out" >> /var/log/blog-gen/health.log
                HSH
                chmod +x /usr/local/bin/blog-gen-health-log.sh
                cat > /etc/systemd/system/blog-gen-health.service <<'UNIT'
                [Unit]
                Description=blog-gen health probe
                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/blog-gen-health-log.sh
                UNIT
                cat > /etc/systemd/system/blog-gen-health.timer <<'UNIT'
                [Unit]
                Description=Run the blog-gen health probe every minute
                [Timer]
                OnBootSec=60
                OnUnitActiveSec=60
                [Install]
                WantedBy=timers.target
                UNIT
                systemctl daemon-reload
                systemctl enable --now blog-gen-health.timer || true

                # Keep the SSM agent running: the Step Functions state machine
                # gates on DescribeInstanceInformation (this instance reporting
                # Online) before handing off the release job, and the instance
                # role now carries AmazonSSMManagedInstanceCore. Ensure it is up.
                snap start amazon-ssm-agent 2>/dev/null || true
                systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service 2>/dev/null || true

                # Metrics (CPU/mem/disk on / and /data) + the five log streams.
                # Quoted heredoc so the agent's ${!aws:InstanceId} placeholder
                # (Fn::Sub emits the literal ${!aws:InstanceId}) survives to the agent.
                cat > "$CW/etc/blog-gen-logs.json" <<'CWJSON'
                {
                  "agent": { "run_as_user": "root", "metrics_collection_interval": 60 },
                  "metrics": {
                    "namespace": "BlogGen/Instance",
                    "append_dimensions": { "InstanceId": "${!aws:InstanceId}" },
                    "metrics_collected": {
                      "cpu": { "measurement": ["cpu_usage_idle", "cpu_usage_iowait"], "totalcpu": true },
                      "mem": { "measurement": ["mem_used_percent"] },
                      "disk": { "measurement": ["used_percent"], "resources": ["/", "/data"] }
                    }
                  },
                  "logs": {
                    "logs_collected": {
                      "files": {
                        "collect_list": [
                          { "file_path": "/var/log/cloud-init-output.log", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/boot" },
                          { "file_path": "/var/log/syslog", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/syslog" },
                          { "file_path": "/var/log/blog-gen/health.log", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/health" }
                        ]
                      }
                    }
                  }
                }
                CWJSON
                "$CW/bin/amazon-cloudwatch-agent-ctl" -a fetch-config -m ec2 -s -c file:"$CW/etc/blog-gen-logs.json" || true

                for i in $(seq 1 90); do
                  VOL_ID=$(aws ec2 describe-volumes \
                    --filters "Name=tag:Project,Values=${ProjectName}" "Name=tag:Name,Values=${ProjectName}-data" "Name=availability-zone,Values=$AZ" \
                    --query 'Volumes[0].VolumeId' --output text 2>/dev/null || echo None)
                  if [ "$VOL_ID" = "None" ] || [ -z "$VOL_ID" ]; then echo "waiting for data volume to exist [$i]"; sleep 10; continue; fi
                  HOLDER=$(aws ec2 describe-volumes --volume-ids "$VOL_ID" --query 'Volumes[0].Attachments[0].InstanceId' --output text 2>/dev/null || echo None)
                  VST=$(aws ec2 describe-volumes --volume-ids "$VOL_ID" --query 'Volumes[0].State' --output text 2>/dev/null || echo unknown)
                  if [ "$HOLDER" = "$INSTANCE_ID" ]; then echo "data volume $VOL_ID already attached here"; break; fi
                  if [ "$VST" = "available" ]; then
                    if aws ec2 attach-volume --volume-id "$VOL_ID" --instance-id "$INSTANCE_ID" --device /dev/sdf >/dev/null 2>&1; then
                      echo "attached data volume $VOL_ID"; break
                    fi
                  fi
                  echo "waiting for data volume $VOL_ID (state=$VST holder=$HOLDER) [$i]"; sleep 10
                done

                # Resolve the attached data volume's block device, then format
                # once and mount at /data. Nitro/Graviton instances (t4g, t3, …)
                # expose EBS volumes as NVMe devices (/dev/nvmeXn1), NOT the
                # requested /dev/sdf|/dev/xvdf, so match by the EBS volume id: the
                # NVMe serial is "vol" + the volume id with its hyphen removed,
                # surfaced at /dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_<serial>.
                # Fall back to /dev/xvdf for any legacy (non-Nitro) instance.
                SERIAL="vol$(echo "$VOL_ID" | sed 's/^vol-//')"
                BYID="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$SERIAL"
                DEV=""
                for i in $(seq 1 30); do
                  if [ -e "$BYID" ]; then DEV=$(readlink -f "$BYID"); break; fi
                  if [ -b /dev/xvdf ]; then DEV=/dev/xvdf; break; fi
                  sleep 5
                done
                if [ -n "$DEV" ] && [ -b "$DEV" ]; then
                  blkid "$DEV" || mkfs.ext4 -L blogdata "$DEV"
                  mkdir -p /data
                  grep -q "LABEL=blogdata" /etc/fstab || echo "LABEL=blogdata /data ext4 defaults,nofail 0 2" >> /etc/fstab
                  mount -a
                fi
                mkdir -p /data/generated-content /data/work /data/memory /data/pending \
                         /data/n8n /data/postgres /data/redis
                # The n8n container runs as user "node" (uid 1000) with /data/n8n
                # mounted at /home/node/.n8n; it must be writable so n8n can save
                # its auto-generated encryption key + config. Without this, n8n
                # crash-loops on "EACCES: permission denied, open .n8n/config".
                chown -R 1000:1000 /data/n8n

                # --- Docker + Compose. On a stock AMI these are not present; install
                # --- them once (arm64). No NVIDIA/GPU runtime — nothing runs a
                # --- local model on this box.
                if ! command -v docker >/dev/null 2>&1; then
                  install -m 0755 -d /etc/apt/keyrings
                  curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                  chmod a+r /etc/apt/keyrings/docker.gpg
                  echo "deb [arch=$ARCH signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                    > /etc/apt/sources.list.d/docker.list
                  apt-get update -y
                  apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
                fi
                systemctl enable --now docker

                # Internal PostgreSQL password for the localhost-only metadata DB.
                # Generated once and kept on the persistent volume next to the DB
                # data, so an instance replacement reuses the same credential (a
                # regenerated password would fail auth against the existing data).
                # Compose reads .env from its working directory for variable interpolation.
                if [ ! -s /data/orchestration.env ]; then
                  (umask 077; echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > /data/orchestration.env)
                fi
                cp /data/orchestration.env /opt/blog-gen/.env
                chmod 600 /opt/blog-gen/.env

                # --- Orchestration plane: n8n (workflows), PostgreSQL (n8n state),
                # --- Redis (queue/cache). State persists on /data so it survives
                # --- stop/start. n8n binds 127.0.0.1:5678; the Step Functions
                # --- machine reaches it after the SSM ready gate.
                cat > /opt/blog-gen/docker-compose.yml <<'COMPOSE'
                services:
                  postgres:
                    image: postgres:16-alpine
                    restart: unless-stopped
                    environment:
                      POSTGRES_USER: n8n
                      POSTGRES_PASSWORD: ${!POSTGRES_PASSWORD}
                      POSTGRES_DB: n8n
                    volumes:
                      - /data/postgres:/var/lib/postgresql/data
                  redis:
                    image: redis:7-alpine
                    restart: unless-stopped
                    volumes:
                      - /data/redis:/data
                  n8n:
                    image: n8nio/n8n:latest
                    restart: unless-stopped
                    depends_on: [postgres, redis]
                    environment:
                      DB_TYPE: postgresdb
                      DB_POSTGRESDB_HOST: postgres
                      DB_POSTGRESDB_DATABASE: n8n
                      DB_POSTGRESDB_USER: n8n
                      DB_POSTGRESDB_PASSWORD: ${!POSTGRES_PASSWORD}
                      QUEUE_BULL_REDIS_HOST: redis
                      N8N_DIAGNOSTICS_ENABLED: "false"
                    ports:
                      - "127.0.0.1:5678:5678"
                    volumes:
                      - /data/n8n:/home/node/.n8n
                COMPOSE

                cat > /etc/systemd/system/blog-gen-orchestration.service <<'UNIT'
                [Unit]
                Description=blog-gen orchestration plane (n8n + PostgreSQL + Redis)
                After=docker.service network-online.target
                Requires=docker.service
                [Service]
                Type=oneshot
                RemainAfterExit=yes
                WorkingDirectory=/opt/blog-gen
                ExecStart=/usr/bin/docker compose -f /opt/blog-gen/docker-compose.yml up -d
                ExecStop=/usr/bin/docker compose -f /opt/blog-gen/docker-compose.yml down
                UNIT

                # --- (Phase B) The generator worker no longer runs on this box —
                # --- release content is generated serverlessly on the blog-gen-content
                # --- Fargate task. The box runs only the n8n/PostgreSQL/Redis plane.

                # --- Health probe for the 60s health timer configured above.
                cat > /opt/blog-gen/health.sh <<'HEALTH'
                #!/usr/bin/env bash
                systemctl is-active --quiet docker || { echo "UNHEALTHY: docker down"; exit 1; }
                curl -sf http://127.0.0.1:5678/healthz >/dev/null 2>&1 || { echo "UNHEALTHY: n8n not ready"; exit 1; }
                echo "READY"
                HEALTH
                chmod +x /opt/blog-gen/health.sh

                # --- Auto-start the orchestration (n8n/PG/Redis compose) plane.
                systemctl daemon-reload
                systemctl enable --now blog-gen-orchestration

                /opt/blog-gen/health.sh || echo "not healthy yet; services will converge"
                echo "instance init complete"

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetId"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-instance"
        - Key: Project
          Value: !Ref ProjectName

  # The data volume is deliberately NOT attached with an AWS::EC2::VolumeAttachment.
  # A single retained volume plus that resource makes every instance-replacing
  # update fail with "volume already attached" (CloudFormation creates the new
  # attachment before deleting the old one, but a volume attaches to only one
  # instance). Instead the instance attaches this volume itself at boot, by tag
  # (see UserData + the ec2:AttachVolume grant on InstanceRole). The Name/Project
  # tags below are how the instance locates it. AZ is pinned to the instance's AZ
  # (same subnet), so a replacement keeps the volume in place.
  PersistentVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: !Ref EbsVolumeSizeGb
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-data"
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  InstanceId:
    Description: EC2 On-Demand instance ID (pass to the scheduler stack as InstanceId).
    Value: !Ref Instance
    Export:
      Name: !Sub "${ProjectName}-InstanceId"
  InstancePublicIp:
    Description: Public IP (SSH; n8n reached via SSH tunnel to 127.0.0.1:5678).
    Value: !GetAtt Instance.PublicIp
  ContentBucketName:
    Description: >
      S3 bucket the worker publishes generated content to (OUTPUT_S3_BUCKET) —
      the bootstrap-created content bucket, or the OutputS3Bucket override when
      supplied.
    Value: !If
      - HasOutputBucket
      - !Ref OutputS3Bucket
      - !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"
  PersistentVolumeId:
    Description: Persistent gp3 data volume ID.
    Value: !Ref PersistentVolume
    Export:
      Name: !Sub "${ProjectName}-PersistentVolumeId"
  NotificationsSecretArn:
    Description: >
      ARN of the SMTP-password secret. Set the real Turbo SMTP password with:
      aws secretsmanager put-secret-value --secret-id <this-arn> --secret-string '<password>'
    Value: !Ref NotificationsSecret
    Export:
      Name: !Sub "${ProjectName}-NotificationsSecretArn"
  KeyPairName:
    Description: The key pair the instance uses (supplied or stack-managed).
    Value: !If [HasKeyPair, !Ref KeyPairName, !Ref ManagedKeyPair]
  ManagedKeyPrivateKeyParam:
    Condition: ManageKeyPair
    Description: >
      SSM parameter holding the managed key's private key. Retrieve it with:
      aws ssm get-parameter --name <this> --with-decryption --query Parameter.Value --output text
    Value: !Sub "/ec2/keypair/${ManagedKeyPair.KeyPairId}"
