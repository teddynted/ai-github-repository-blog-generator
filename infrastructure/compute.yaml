AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub AI Blog Generator - Compute stack. An On-Demand EC2 instance (Ubuntu)
  that runs n8n + OpenClaw + Ollama via Docker Compose, plus a persistent gp3
  EBS volume that survives start/stop cycles (models, n8n state, Repository
  Memory). The instance is powered on/off on a fixed daily schedule by the
  scheduler stack (default 18:00-20:00, 7 days a week); On-Demand is used so a start
  always succeeds within that window (no Spot-capacity dependency). Imports the
  subnet and security group from the network stack and the SQS queue from the
  serverless stack.

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix and tag value (must match the other stacks).
  InstanceType:
    Type: String
    Default: g4dn.xlarge
    Description: EC2 instance type for the On-Demand instance (GPU recommended for Ollama).
  KeyPairName:
    Type: String
    Default: ""
    Description: >
      Existing EC2 key pair name to use for SSH. Leave blank and the stack
      creates and manages one (named <project>-key); its private key is stored in
      SSM Parameter Store at /ec2/keypair/<key-pair-id>.
  EbsVolumeSizeGb:
    Type: Number
    Default: 100
    MinValue: 20
    Description: Size of the persistent gp3 volume (models + n8n state + memory).
  OllamaModel:
    Type: String
    Default: qwen2.5:7b
    Description: Local model served by Ollama.
  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      Amazon Bedrock Claude model id for the technical-writer stage (e.g.
      anthropic.claude-3-5-sonnet-20240620-v1:0). When set, Claude writes the
      content (grounded in the local Ollama engineering analysis); blank keeps
      the local model as the writer (zero paid inference). Auth is IAM via the
      instance role — no API key.
  EnableGpu:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Install NVIDIA drivers + container toolkit and give Ollama the GPU. Set to
      "false" to run Ollama CPU-only (e.g. testing on a non-GPU instance type).
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Fallback base AMI (latest Ubuntu 22.04 amd64) when CustomAmi is unset.
  CustomAmi:
    Type: String
    Default: ""
    Description: >
      Pre-baked worker AMI id from scripts/build-ami.sh (Docker, NVIDIA, Ollama +
      model, systemd services). When set, boot skips all installs — the fast
      path. Leave blank to fall back to the stock Ubuntu AMI (slow first boot).
  AmiScriptsKey:
    Type: String
    Default: ""
    Description: >
      S3 key of scripts/ami/provision.sh (uploaded by deploy.yml). Used only on
      the fallback path to provision a stock AMI at boot.
  OutputS3Bucket:
    Type: String
    Default: ""
    Description: >
      Optional override: publish generated content to this pre-existing S3
      bucket instead of the dedicated content bucket created by the bootstrap
      stack (<project>-content-<account>-<region>). When set, the instance role
      is granted s3:PutObject on it. Leave blank for the normal case.

  ArtifactsBucket:
    Type: String
    Default: ""
    Description: >
      S3 bucket holding the worker binary (same bucket used for Lambda
      artifacts). Required to install the worker service on the instance.
  WorkerCodeKey:
    Type: String
    Default: ""
    Description: >
      S3 key of the linux/amd64 worker binary (e.g. "<sha>/worker"). When set
      with ArtifactsBucket, the instance downloads it and runs it as a systemd
      service.
  NotifyEmailFrom:
    Type: String
    Default: ""
    Description: From address for email notifications (blank disables email).
  NotifyEmailTo:
    Type: String
    Default: ""
    Description: Comma-separated recipient addresses for email notifications.
  SmtpHost:
    Type: String
    Default: pro.turbo-smtp.com
    Description: SMTP relay host (Turbo SMTP).
  SmtpPort:
    Type: Number
    Default: 587
    Description: SMTP port (587 STARTTLS or 465 implicit TLS).
  SmtpUsername:
    Type: String
    Default: ""
    Description: SMTP account username (the password is stored in Secrets Manager).
  NotifyWebhookUrl:
    Type: String
    Default: ""
    Description: Optional Slack/webhook URL for notifications.

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  # No external key supplied → the stack creates and manages one.
  ManageKeyPair: !Equals [!Ref KeyPairName, ""]
  HasCustomAmi: !Not [!Equals [!Ref CustomAmi, ""]]
  HasOutputBucket: !Not [!Equals [!Ref OutputS3Bucket, ""]]
  HasWorkerCode: !And
    - !Not [!Equals [!Ref ArtifactsBucket, ""]]
    - !Not [!Equals [!Ref WorkerCodeKey, ""]]

Resources:
  # Container for the SMTP password. CFN creates it with a random placeholder;
  # the operator sets the real Turbo SMTP password out-of-band (put-secret-value)
  # so it never appears in the template or parameter history. Subsequent stack
  # updates leave the value untouched.
  NotificationsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/notifications/smtp-password"
      Description: SMTP password for Turbo SMTP email notifications (set the real value with put-secret-value).
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  # Created only when no external KeyPairName is supplied. CloudFormation/EC2
  # generates the key pair and stores the private key in SSM Parameter Store at
  # /ec2/keypair/<key-pair-id> (SecureString) — retrieve it with get-parameter.
  ManagedKeyPair:
    Type: AWS::EC2::KeyPair
    Condition: ManageKeyPair
    Properties:
      KeyName: !Sub "${ProjectName}-key"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Drain the events queue.
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::ImportValue: !Sub "${ProjectName}-QueueArn"
              # Read the shared repository-credentials secret (PAT, when cloning)
              # and the SMTP password (for email).
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub "${ProjectName}-RepoCredentialsSecretArn"
                  - !Ref NotificationsSecret
              # Update last-processed commit SHA after a run.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName:
                        Fn::ImportValue: !Sub "${ProjectName}-RepositoriesTableName"
              # Ship logs.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/instance:*"
              # Invoke Claude on Bedrock for the technical-writer stage (used only
              # when BEDROCK_MODEL_ID is set; the run falls back to the local model
              # otherwise). Scoped to Anthropic foundation models + inference
              # profiles — auth is this instance role, so there is no API key.
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              # Publish CPU/mem/disk metrics via the CloudWatch agent (scoped to
              # this project's metric namespace; PutMetricData cannot be resource-scoped).
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: "BlogGen/Instance"
              # Attach the persistent data volume at boot (see UserData). The
              # volume is managed by CloudFormation but attached by the instance
              # itself, so a stack update that replaces the instance never hits
              # the CloudFormation "volume already attached" failure. Scoped to
              # this project's tagged volume + instances; DescribeVolumes cannot
              # be resource-scoped.
              - Effect: Allow
                Action: ec2:AttachVolume
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: !Ref ProjectName
              - Effect: Allow
                Action: ec2:DescribeVolumes
                Resource: "*"
              # Publish generated content to the dedicated content bucket created
              # by the bootstrap stack (or the OutputS3Bucket override when one is
              # supplied). The bucket name is deterministic, so no cross-stack
              # import is needed.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !If
                  - HasOutputBucket
                  - !Sub "arn:${AWS::Partition}:s3:::${OutputS3Bucket}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-content-${AWS::AccountId}-${AWS::Region}/*"
              # Download the worker binary from the artifacts bucket at boot.
              - !If
                - HasWorkerCode
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}/*"
                - !Ref AWS::NoValue
              # Email notifications go through Turbo SMTP (outbound SMTP over
              # TLS), so no AWS mail permission is required — the worker only
              # needs egress on 587/465 and reads the SMTP password from the
              # NotificationsSecret above.

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # A launch template centralizes the instance configuration (type, AMI, key,
  # profile, security group, root volume, user data) so the AWS::EC2::Instance
  # below stays a thin reference. This is an On-Demand instance: there are no
  # InstanceMarketOptions, so a start (from the scheduler stack at 18:00 daily,
  # or a manual maintenance start) always succeeds without depending on
  # Spot capacity at a max price.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-lt"
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !If [HasCustomAmi, !Ref CustomAmi, !Ref LatestUbuntuAmi]
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref ManagedKeyPair]
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-InstanceSecurityGroupId"
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              # Must be >= the baked worker AMI's root snapshot (40 GB, sized in
              # packer/worker/blog-gen.pkr.hcl for Docker + the ollama image +
              # the baked model seed). A smaller root fails to launch from it.
              VolumeSize: 40
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                set -euxo pipefail
                # --- Runtime init only. Heavy installs (Docker, NVIDIA, Ollama image,
                # --- the model, systemd units) are pre-baked into the CustomAmi by
                # --- scripts/ami/provision.sh; a stock AMI runs that same script here.
                export DEBIAN_FRONTEND=noninteractive
                mkdir -p /opt/blog-gen /etc/blog-gen

                # --- Attach the persistent data volume, then mount it at /data.
                # The volume is created by CloudFormation (Retain) but attached
                # HERE at boot — NOT via an AWS::EC2::VolumeAttachment — so a
                # stack update that REPLACES this instance never fails with
                # "volume already attached": CloudFormation terminates the old
                # instance and the volume is then free to (re)attach here. The
                # loop also covers first boot (waits for the volume to exist).
                export AWS_DEFAULT_REGION=${AWS::Region}
                command -v aws >/dev/null 2>&1 || { apt-get update -y && apt-get install -y awscli; }
                TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300" || true)
                imds() { curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" "http://169.254.169.254/latest/meta-data/$1" || true; }
                INSTANCE_ID=$(imds instance-id)
                AZ=$(imds placement/availability-zone)

                # --- Observability: ship boot/worker/ollama logs + CPU/mem/disk
                # --- metrics to CloudWatch so the box is diagnosable without
                # --- SSH/SSM. Installs the agent if the AMI lacks it (idempotent).
                # --- Worker/Ollama get dedicated log streams (systemd drop-ins);
                # --- a 60s health probe records readiness. Role grants
                # --- CreateLogStream + PutLogEvents + PutMetricData.
                CW=/opt/aws/amazon-cloudwatch-agent
                if [ ! -x "$CW/bin/amazon-cloudwatch-agent-ctl" ]; then
                  ARCH=$(dpkg --print-architecture)
                  curl -fsSL "https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/$ARCH/latest/amazon-cloudwatch-agent.deb" -o /tmp/cwagent.deb \
                    && dpkg -i -E /tmp/cwagent.deb || true
                  rm -f /tmp/cwagent.deb
                fi
                mkdir -p "$CW/etc" /var/log/blog-gen

                # Dedicated worker + ollama log streams via systemd drop-ins (they
                # start after /data mounts, below, so these are in place first).
                mkdir -p /etc/systemd/system/blog-gen-worker.service.d /etc/systemd/system/blog-gen-ollama.service.d
                cat > /etc/systemd/system/blog-gen-worker.service.d/logging.conf <<'DROPIN'
                [Service]
                StandardOutput=append:/var/log/blog-gen/worker.log
                StandardError=append:/var/log/blog-gen/worker.log
                DROPIN
                cat > /etc/systemd/system/blog-gen-ollama.service.d/logging.conf <<'DROPIN'
                [Service]
                StandardOutput=append:/var/log/blog-gen/ollama.log
                StandardError=append:/var/log/blog-gen/ollama.log
                DROPIN

                # 60s health probe -> its own stream (READY / UNHEALTHY: <reason>).
                cat > /usr/local/bin/blog-gen-health-log.sh <<'HSH'
                #!/usr/bin/env bash
                out=$(/opt/blog-gen/health.sh 2>&1) || true
                echo "$(date -u +%FT%TZ) $out" >> /var/log/blog-gen/health.log
                HSH
                chmod +x /usr/local/bin/blog-gen-health-log.sh
                cat > /etc/systemd/system/blog-gen-health.service <<'UNIT'
                [Unit]
                Description=blog-gen health probe
                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/blog-gen-health-log.sh
                UNIT
                cat > /etc/systemd/system/blog-gen-health.timer <<'UNIT'
                [Unit]
                Description=Run the blog-gen health probe every minute
                [Timer]
                OnBootSec=60
                OnUnitActiveSec=60
                [Install]
                WantedBy=timers.target
                UNIT
                systemctl daemon-reload
                systemctl enable --now blog-gen-health.timer || true

                # Metrics (CPU/mem/disk on / and /data) + the five log streams.
                # Quoted heredoc so the agent's ${!aws:InstanceId} placeholder
                # (Fn::Sub emits the literal ${!aws:InstanceId}) survives to the agent.
                cat > "$CW/etc/blog-gen-logs.json" <<'CWJSON'
                {
                  "agent": { "run_as_user": "root", "metrics_collection_interval": 60 },
                  "metrics": {
                    "namespace": "BlogGen/Instance",
                    "append_dimensions": { "InstanceId": "${!aws:InstanceId}" },
                    "metrics_collected": {
                      "cpu": { "measurement": ["cpu_usage_idle", "cpu_usage_iowait"], "totalcpu": true },
                      "mem": { "measurement": ["mem_used_percent"] },
                      "disk": { "measurement": ["used_percent"], "resources": ["/", "/data"] }
                    }
                  },
                  "logs": {
                    "logs_collected": {
                      "files": {
                        "collect_list": [
                          { "file_path": "/var/log/cloud-init-output.log", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/boot" },
                          { "file_path": "/var/log/syslog", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/syslog" },
                          { "file_path": "/var/log/blog-gen/worker.log", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/worker" },
                          { "file_path": "/var/log/blog-gen/ollama.log", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/ollama" },
                          { "file_path": "/var/log/blog-gen/health.log", "log_group_name": "/${ProjectName}/instance", "log_stream_name": "{instance_id}/health" }
                        ]
                      }
                    }
                  }
                }
                CWJSON
                "$CW/bin/amazon-cloudwatch-agent-ctl" -a fetch-config -m ec2 -s -c file:"$CW/etc/blog-gen-logs.json" || true

                for i in $(seq 1 90); do
                  VOL_ID=$(aws ec2 describe-volumes \
                    --filters "Name=tag:Project,Values=${ProjectName}" "Name=tag:Name,Values=${ProjectName}-data" "Name=availability-zone,Values=$AZ" \
                    --query 'Volumes[0].VolumeId' --output text 2>/dev/null || echo None)
                  if [ "$VOL_ID" = "None" ] || [ -z "$VOL_ID" ]; then echo "waiting for data volume to exist [$i]"; sleep 10; continue; fi
                  HOLDER=$(aws ec2 describe-volumes --volume-ids "$VOL_ID" --query 'Volumes[0].Attachments[0].InstanceId' --output text 2>/dev/null || echo None)
                  VST=$(aws ec2 describe-volumes --volume-ids "$VOL_ID" --query 'Volumes[0].State' --output text 2>/dev/null || echo unknown)
                  if [ "$HOLDER" = "$INSTANCE_ID" ]; then echo "data volume $VOL_ID already attached here"; break; fi
                  if [ "$VST" = "available" ]; then
                    if aws ec2 attach-volume --volume-id "$VOL_ID" --instance-id "$INSTANCE_ID" --device /dev/sdf >/dev/null 2>&1; then
                      echo "attached data volume $VOL_ID"; break
                    fi
                  fi
                  echo "waiting for data volume $VOL_ID (state=$VST holder=$HOLDER) [$i]"; sleep 10
                done

                # Wait for the block device, format once, and mount at /data.
                DEV=/dev/xvdf
                for i in $(seq 1 30); do [ -b "$DEV" ] && break || sleep 5; done
                if [ -b "$DEV" ]; then
                  blkid "$DEV" || mkfs.ext4 -L blogdata "$DEV"
                  mkdir -p /data
                  grep -q "LABEL=blogdata" /etc/fstab || echo "LABEL=blogdata /data ext4 defaults,nofail 0 2" >> /etc/fstab
                  mount -a
                fi
                mkdir -p /data/ollama /data/generated-content /data/work /data/memory /data/pending

                # Fallback: a stock AMI (no baked marker) runs the canonical
                # provisioner now. A baked CustomAmi skips this entirely (fast path).
                if [ ! -f /opt/blog-gen/.ami-baked ]; then
                  echo "no baked AMI marker; provisioning at boot (slow path)"
                  apt-get update -y && apt-get install -y awscli
                  aws s3 cp "s3://${ArtifactsBucket}/${AmiScriptsKey}" /opt/blog-gen/provision.sh
                  chmod +x /opt/blog-gen/provision.sh
                  OLLAMA_MODEL="${OllamaModel}" ENABLE_GPU="${EnableGpu}" BAKE_MODEL=false \
                    /opt/blog-gen/provision.sh
                fi

                # Seed the model from the baked copy if the volume is empty — avoids a
                # multi-GB download at boot.
                if [ ! -d /data/ollama/models ] && [ -d /opt/blog-gen/ollama-seed/models ]; then
                  cp -a /opt/blog-gen/ollama-seed/. /data/ollama/
                fi

                # --- Worker binary + env (stack-specific values). SMTP password is NOT
                # --- here — the worker reads it from Secrets Manager via the secret ref.
                if [ -n "${WorkerCodeKey}" ]; then
                  export AWS_DEFAULT_REGION=${AWS::Region}
                  command -v aws >/dev/null 2>&1 || { apt-get update -y && apt-get install -y awscli; }
                  aws s3 cp "s3://${ArtifactsBucket}/${WorkerCodeKey}" /usr/local/bin/blog-gen-worker
                  chmod +x /usr/local/bin/blog-gen-worker
                  cat > /etc/blog-gen/worker.env <<'ENVEOF'
                AWS_REGION=${AWS::Region}
                QUEUE_URL=${QueueUrl}
                REPOSITORIES_TABLE=${RepositoriesTable}
                REPO_SECRET_ID=${RepoSecretId}
                OLLAMA_MODEL=${OllamaModel}
                OLLAMA_BASE_URL=http://127.0.0.1:11434
                BEDROCK_MODEL_ID=${BedrockModelId}
                OUTPUT_DIR=/data/generated-content
                OUTPUT_S3_BUCKET=${OutputBucketName}
                WORK_DIR=/data/work
                MEMORY_DIR=/data/memory
                PENDING_DIR=/data/pending
                NOTIFY_WEBHOOK_URL=${NotifyWebhookUrl}
                NOTIFY_EMAIL_FROM=${NotifyEmailFrom}
                NOTIFY_EMAIL_TO=${NotifyEmailTo}
                SMTP_HOST=${SmtpHost}
                SMTP_PORT=${SmtpPort}
                SMTP_USERNAME=${SmtpUsername}
                SMTP_PASSWORD_SECRET=${NotificationsSecret}
                ENVEOF
                  chmod 600 /etc/blog-gen/worker.env
                fi

                # --- Auto-start. The systemd units (blog-gen-ollama, blog-gen-worker)
                # --- are baked into the AMI / written by the provisioner above;
                # --- enabling them makes the stack restart automatically on every boot.
                systemctl daemon-reload
                systemctl enable --now blog-gen-ollama
                if [ -x /usr/local/bin/blog-gen-worker ]; then
                  systemctl enable --now blog-gen-worker
                fi

                # If the model was not baked, pull it once now (persists on /data).
                if [ ! -d /data/ollama/models ]; then
                  for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version >/dev/null && break || sleep 3; done
                  docker exec ollama ollama pull "${OllamaModel}" || echo "model pull deferred; worker retries"
                fi

                /opt/blog-gen/health.sh || echo "not healthy yet; services will converge"
                echo "instance init complete"
              - QueueUrl:
                  Fn::ImportValue: !Sub "${ProjectName}-QueueUrl"
                RepositoriesTable:
                  Fn::ImportValue: !Sub "${ProjectName}-RepositoriesTableName"
                RepoSecretId:
                  Fn::ImportValue: !Sub "${ProjectName}-RepoCredentialsSecretArn"
                # Effective output bucket: the OutputS3Bucket override if given,
                # else the bootstrap-created dedicated content bucket.
                OutputBucketName: !If
                  - HasOutputBucket
                  - !Ref OutputS3Bucket
                  - !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetId"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-instance"
        - Key: Project
          Value: !Ref ProjectName

  # The data volume is deliberately NOT attached with an AWS::EC2::VolumeAttachment.
  # A single retained volume plus that resource makes every instance-replacing
  # update fail with "volume already attached" (CloudFormation creates the new
  # attachment before deleting the old one, but a volume attaches to only one
  # instance). Instead the instance attaches this volume itself at boot, by tag
  # (see UserData + the ec2:AttachVolume grant on InstanceRole). The Name/Project
  # tags below are how the instance locates it. AZ is pinned to the instance's AZ
  # (same subnet), so a replacement keeps the volume in place.
  PersistentVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: !Ref EbsVolumeSizeGb
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-data"
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  InstanceId:
    Description: EC2 On-Demand instance ID (pass to the scheduler stack as InstanceId).
    Value: !Ref Instance
    Export:
      Name: !Sub "${ProjectName}-InstanceId"
  InstancePublicIp:
    Description: Public IP (SSH; n8n/Ollama reached via SSH tunnel only).
    Value: !GetAtt Instance.PublicIp
  ContentBucketName:
    Description: >
      S3 bucket the worker publishes generated content to (OUTPUT_S3_BUCKET) —
      the bootstrap-created content bucket, or the OutputS3Bucket override when
      supplied.
    Value: !If
      - HasOutputBucket
      - !Ref OutputS3Bucket
      - !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"
  PersistentVolumeId:
    Description: Persistent gp3 data volume ID.
    Value: !Ref PersistentVolume
    Export:
      Name: !Sub "${ProjectName}-PersistentVolumeId"
  NotificationsSecretArn:
    Description: >
      ARN of the SMTP-password secret. Set the real Turbo SMTP password with:
      aws secretsmanager put-secret-value --secret-id <this-arn> --secret-string '<password>'
    Value: !Ref NotificationsSecret
    Export:
      Name: !Sub "${ProjectName}-NotificationsSecretArn"
  KeyPairName:
    Description: The key pair the instance uses (supplied or stack-managed).
    Value: !If [HasKeyPair, !Ref KeyPairName, !Ref ManagedKeyPair]
  ManagedKeyPrivateKeyParam:
    Condition: ManageKeyPair
    Description: >
      SSM parameter holding the managed key's private key. Retrieve it with:
      aws ssm get-parameter --name <this> --with-decryption --query Parameter.Value --output text
