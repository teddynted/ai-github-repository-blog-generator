AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub AI Blog Generator - Content Generation stack (serverless). Generates the
  full release content suite (blog + storyboard + voiceover + social posts + SEO +
  artifacts JSON) on ECS Fargate instead of the long-running EC2 worker. The
  GenerateContent state machine runs the content-runner task (from an ECR image),
  which builds the Release Context and publishes every artifact to the content
  bucket, then best-effort starts the video state machine. Imports the VPC + public
  subnet from the network stack.

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix and tag value (must match the other stacks).
  RunnerImageTag:
    Type: String
    Default: latest
    Description: >
      Tag of the content-runner image in the ECR repo this stack creates (pushed by
      deploy.yml before a task runs). The task definition references <repo-uri>:<tag>.
  ContentBucket:
    Type: String
    Default: ""
    Description: >
      Bucket the runner publishes generated content to. Blank uses the
      bootstrap-created content bucket (<project>-content-<account>-<region>).
  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      Bedrock Claude model id (primary AI leg). Blank runs Anthropic-only, which
      then requires AnthropicApiKeySecret.
  AnthropicModel:
    Type: String
    Default: ""
    Description: Anthropic API model id (fallback leg). Blank uses the client default.
  TaskCpu:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096"]
    Description: Fargate task vCPU units for the content runner (2048 = 2 vCPU).
  TaskMemory:
    Type: String
    Default: "4096"
    Description: Fargate task memory (MiB) — must be valid for the chosen TaskCpu.
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: Retention for the content-runner log group.
  # --- n8n trigger-ingress (Option B): after generation, hand the release to the
  # --- n8n review/approval workflow via its private webhook. Opt-in.
  EnableN8nNotify:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When "true", the state machine starts the n8n host, resolves its private
      IP, and invokes the notify-n8n Lambda to POST the release to n8n's webhook
      after content generation. Requires the compute stack (exports InstanceId)
      and the review workflow's webhook to be active.
  ArtifactsBucket:
    Type: String
    Default: ""
    Description: S3 bucket holding the notify-n8n Lambda zip (required when EnableN8nNotify=true).
  NotifyN8nCodeKey:
    Type: String
    Default: notify-n8n.zip
    Description: S3 key of the notify-n8n Lambda package in ArtifactsBucket.
  N8nWebhookPath:
    Type: String
    Default: release-review
    Description: n8n production webhook path the review workflow listens on.
  N8nInstanceId:
    Type: String
    Default: ""
    Description: >
      EC2 instance id of the n8n host, passed in by deploy.yml (resolved from the
      compute stack's InstanceId output). A parameter — not Fn::ImportValue — so
      the compute stack can replace the instance without a cross-stack export lock.
  # --- Publish-on-approve: the n8n poller calls this Lambda on /approve to open a
  # --- blog PR + promote the release's artifacts to an approved-only S3 prefix.
  EnablePublishOnApprove:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When "true", create the publish-release Lambda + Function URL.
  PublishCodeKey:
    Type: String
    Default: publish-release.zip
    Description: S3 key of the publish-release Lambda package in ArtifactsBucket.
  TargetRepo:
    Type: String
    Default: teddynted/ai-github-repository-blog-generator
    Description: "owner/repo the approved-blog PR is opened in."
  PublishTokenParam:
    Type: String
    Default: /blog-gen/github/publish-token
    Description: SSM SecureString name holding a GitHub token (Contents+PRs write on TargetRepo).
  PublishSecretParam:
    Type: String
    Default: /blog-gen/publish/shared-secret
    Description: SSM SecureString name holding the shared secret the poller sends in X-Publish-Secret.

Conditions:
  HasContentBucket: !Not [!Equals [!Ref ContentBucket, ""]]
  EnableN8n: !Equals [!Ref EnableN8nNotify, "true"]
  EnablePublish: !Equals [!Ref EnablePublishOnApprove, "true"]

Resources:
  # ---------------------------------------------------------------------------
  # Runner image registry + Fargate cluster/task.
  # ---------------------------------------------------------------------------
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-content-runner"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"expire untagged","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":14},"action":{"type":"expire"}}]}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-content"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    # Delete (not Retain) so a rolled-back/cleaned stack does not orphan the log
    # group and collide with "already exists" on the next create.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/${ProjectName}/content-runner"
      RetentionInDays: !Ref LogRetentionDays

  # Fargate tasks run in the public subnet with a public IP so they can reach ECR,
  # S3, Bedrock, Secrets Manager, DynamoDB, and the GitHub API without a NAT. Egress-only.
  FargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} content runner (egress only)"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-VpcId"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound to ECR, S3, Bedrock, Secrets Manager, DynamoDB, GitHub, CloudWatch.
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --- n8n trigger-ingress (Option B), all gated on EnableN8nNotify -----------
  # SG for the notify-n8n Lambda. Egress-only; the matching ingress on the n8n
  # host SG (below) is what opens the path to n8n's port.
  NotifyN8nSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: EnableN8n
    Properties:
      GroupDescription: !Sub "${ProjectName} notify-n8n Lambda (egress only)"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-VpcId"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound to the n8n host (private IP) on the n8n port.
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Open the n8n port on the host SG only to the notify-n8n Lambda SG — no public
  # exposure. The host SG is created in the network stack and imported here.
  NotifyN8nIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableN8n
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-InstanceSecurityGroupId"
      IpProtocol: tcp
      FromPort: 5678
      ToPort: 5678
      SourceSecurityGroupId: !GetAtt NotifyN8nSecurityGroup.GroupId
      Description: n8n webhook from the notify-n8n Lambda.

  NotifyN8nRole:
    Type: AWS::IAM::Role
    Condition: EnableN8n
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # VPC access policy grants the ENI management + log shipping the function needs.
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"

  NotifyN8nFunction:
    Type: AWS::Lambda::Function
    Condition: EnableN8n
    # ArtifactsBucket is always supplied by deploy.yml when EnableN8nNotify=true;
    # its empty default only exists for the disabled case (function not created).
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      FunctionName: !Sub "${ProjectName}-notify-n8n"
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 128
      Timeout: 240
      Role: !GetAtt NotifyN8nRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref NotifyN8nCodeKey
      Environment:
        Variables:
          N8N_WEBHOOK_PATH: !Ref N8nWebhookPath
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetId"
        SecurityGroupIds:
          - !GetAtt NotifyN8nSecurityGroup.GroupId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --- Publish-on-approve Lambda (gated on EnablePublishOnApprove) -------------
  PublishReleaseRole:
    Type: AWS::IAM::Role
    Condition: EnablePublish
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: publish-release
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read release artifacts + write the promoted published/ copies.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${B}"
                    - B: !If [HasContentBucket, !Ref ContentBucket, !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"]
                  - !Sub
                    - "arn:${AWS::Partition}:s3:::${B}/*"
                    - B: !If [HasContentBucket, !Ref ContentBucket, !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"]
              # Content bucket is SSE-KMS: copying needs a data key + decrypt, scoped
              # to the S3 service in this account/region (never direct KMS use).
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt, kms:DescribeKey]
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"
                    kms:CallerAccount: !Ref AWS::AccountId
              # Read the GitHub token + shared secret (SecureString).
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PublishTokenParam}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PublishSecretParam}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  PublishReleaseFunction:
    Type: AWS::Lambda::Function
    Condition: EnablePublish
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      FunctionName: !Sub "${ProjectName}-publish-release"
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt PublishReleaseRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref PublishCodeKey
      Environment:
        Variables:
          CONTENT_BUCKET: !If [HasContentBucket, !Ref ContentBucket, !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"]
          TARGET_REPO: !Ref TargetRepo
          GITHUB_TOKEN_PARAM: !Ref PublishTokenParam
          SHARED_SECRET_PARAM: !Ref PublishSecretParam
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # HTTP API in front of the Lambda (public Lambda Function URLs are blocked in
  # this account). No API-key/JWT authorizer — the handler enforces the shared
  # X-Publish-Secret, so only the n8n poller can invoke it.
  PublishApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: EnablePublish
    Properties:
      Name: !Sub "${ProjectName}-publish"
      ProtocolType: HTTP

  PublishApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: EnablePublish
    Properties:
      ApiId: !Ref PublishApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PublishReleaseFunction.Arn
      PayloadFormatVersion: "2.0"

  PublishApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: EnablePublish
    Properties:
      ApiId: !Ref PublishApi
      RouteKey: "POST /publish"
      Target: !Sub "integrations/${PublishApiIntegration}"

  PublishApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: EnablePublish
    Properties:
      ApiId: !Ref PublishApi
      StageName: "$default"
      AutoDeploy: true

  PublishApiPermission:
    Type: AWS::Lambda::Permission
    Condition: EnablePublish
    Properties:
      FunctionName: !Ref PublishReleaseFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PublishApi}/*/*/publish"

  # Pulls the image + ships logs (the AWS-managed execution policy covers both).
  ContentTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  # The runner's own permissions: read/write the content bucket, invoke Bedrock,
  # read the repositories table + shared secret (per-repo PAT + Anthropic key).
  ContentTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: content-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Publish generated artifacts + read existing ones (S3 idempotency).
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !If
                  - HasContentBucket
                  - !Sub "arn:${AWS::Partition}:s3:::${ContentBucket}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-content-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !If
                  - HasContentBucket
                  - !Sub "arn:${AWS::Partition}:s3:::${ContentBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"
              # The content bucket uses SSE-KMS, so publishing needs a data key
              # (GenerateDataKey) and reading existing artifacts for idempotency
              # reuse needs Decrypt. Scope the grant to the S3 service in this
              # account/region (never direct KMS use) rather than a cross-stack
              # key-ARN import, so it is order-independent and least-privilege.
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "s3.${AWS::Region}.amazonaws.com"
                    kms:CallerAccount: !Ref AWS::AccountId
              # AI generation via Bedrock (InvokeModel cannot be tightly resource-scoped
              # across model ids / inference profiles).
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              # Per-repo PAT + Anthropic API key live under the project secret prefix.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*"
              # Repository metadata (resolves each repo's registered PAT reference).
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${T}"
                    - T:
                        Fn::ImportValue: !Sub "${ProjectName}-RepositoriesTableName"
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${T}/index/*"
                    - T:
                        Fn::ImportValue: !Sub "${ProjectName}-RepositoriesTableName"

  ContentTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-content-runner"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ContentTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ContentTaskRole.Arn
      ContainerDefinitions:
        - Name: runner
          Image: !Sub "${EcrRepository.RepositoryUri}:${RunnerImageTag}"
          Essential: true
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: REPOSITORIES_TABLE
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-RepositoriesTableName"
            - Name: REPO_SECRET_ID
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-RepoCredentialsSecretArn"
            - Name: OUTPUT_S3_BUCKET
              Value: !If
                - HasContentBucket
                - !Ref ContentBucket
                - !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"
            - Name: OUTPUT_S3_PREFIX
              Value: generated-content
            - Name: BEDROCK_MODEL_ID
              Value: !Ref BedrockModelId
            - Name: ANTHROPIC_MODEL
              Value: !Ref AnthropicModel
            # The Anthropic API key secret is created + owned by the compute stack
            # under this deterministic name; the task role can read the whole prefix.
            - Name: ANTHROPIC_API_KEY_SECRET
              Value: !Sub "${ProjectName}/anthropic/api-key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RunnerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: runner

  # ---------------------------------------------------------------------------
  # Orchestration: generate the suite (Fargate) -> best-effort start the video SM.
  # ---------------------------------------------------------------------------
  ContentStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: content-orchestration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ContentTaskDefinition
              - Effect: Allow
                Action:
                  - ecs:StopTask
                  - ecs:DescribeTasks
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ContentTaskExecutionRole.Arn
                  - !GetAtt ContentTaskRole.Arn
              # runTask.sync uses the managed EventBridge rule to wait for completion.
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule"
              # Best-effort trigger of the (deterministically named) video state machine.
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-video"

  # Extra grants for the n8n hand-off branch, kept as a conditional policy so the
  # base role is unchanged when the feature is off.
  ContentStateMachineN8nPolicy:
    Type: AWS::IAM::Policy
    Condition: EnableN8n
    Properties:
      PolicyName: content-n8n-notify
      Roles:
        - !Ref ContentStateMachineRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Start the On-Demand n8n host (DescribeInstances cannot be resource-scoped).
          - Effect: Allow
            Action: ec2:StartInstances
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${N8nInstanceId}"
          - Effect: Allow
            Action: ec2:DescribeInstances
            Resource: "*"
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt NotifyN8nFunction.Arn

  ContentStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-content"
      RoleArn: !GetAtt ContentStateMachineRole.Arn
      DefinitionString: !Sub
        - |
          {
            "Comment": "Generate the release content suite on Fargate, then start video rendering.",
            "TimeoutSeconds": 3600,
            "StartAt": "BuildAndGenerate",
            "States": {
              "BuildAndGenerate": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::ecs:runTask.sync",
                "Parameters": {
                  "LaunchType": "FARGATE",
                  "Cluster": "${ClusterArn}",
                  "TaskDefinition": "${TaskDef}",
                  "NetworkConfiguration": {
                    "AwsvpcConfiguration": {
                      "Subnets": ["${SubnetId}"],
                      "SecurityGroups": ["${SgId}"],
                      "AssignPublicIp": "ENABLED"
                    }
                  },
                  "Overrides": {
                    "ContainerOverrides": [{
                      "Name": "runner",
                      "Environment": [
                        {"Name": "OWNER", "Value.$": "$.detail.owner"},
                        {"Name": "REPO", "Value.$": "$.detail.name"},
                        {"Name": "RELEASE_TAG", "Value.$": "$.detail.release_tag"}
                      ]
                    }]
                  }
                },
                "ResultPath": "$.ecs",
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "GenerateFailed"}],
                "Next": "${AfterGenerate}"
              },
              ${N8nStates}
              "TriggerVideo": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::states:startExecution",
                "Parameters": {
                  "StateMachineArn": "${VideoArn}",
                  "Input": {
                    "owner.$": "$.detail.owner",
                    "name.$": "$.detail.name",
                    "tag.$": "$.detail.release_tag",
                    "bucket": "${ContentBucketName}",
                    "prefix": "generated-content"
                  }
                },
                "ResultPath": "$.video",
                "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.videoError", "Next": "Done"}],
                "Next": "Done"
              },
              "GenerateFailed": {
                "Type": "Fail",
                "Error": "ContentGenerationFailed",
                "Cause": "The content-runner Fargate task failed; see the /blog-gen/content-runner CloudWatch logs and this execution's ECS TaskFailed event for the container error."
              },
              "Done": {"Type": "Succeed"}
            }
          }
        - ClusterArn: !GetAtt EcsCluster.Arn
          TaskDef: !Ref ContentTaskDefinition
          SubnetId:
            Fn::ImportValue: !Sub "${ProjectName}-PublicSubnetId"
          SgId: !GetAtt FargateSecurityGroup.GroupId
          VideoArn: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-video"
          ContentBucketName: !If
            - HasContentBucket
            - !Ref ContentBucket
            - !Sub "${ProjectName}-content-${AWS::AccountId}-${AWS::Region}"
          # When EnableN8nNotify=true, generation flows through the n8n hand-off
          # states before video; otherwise it goes straight to TriggerVideo and
          # N8nStates is empty (identical to the base machine).
          AfterGenerate: !If [EnableN8n, "StartN8nHost", "TriggerVideo"]
          N8nStates: !If
            - EnableN8n
            - !Sub
              - |-
                "StartN8nHost": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ec2:startInstances",
                    "Parameters": {"InstanceIds": ["${InstanceId}"]},
                    "ResultPath": "$.n8nStart",
                    "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.n8nError", "Next": "TriggerVideo"}],
                    "Next": "DescribeN8nHost"
                  },
                  "DescribeN8nHost": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ec2:describeInstances",
                    "Parameters": {"InstanceIds": ["${InstanceId}"]},
                    "ResultPath": "$.n8nHost",
                    "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.n8nError", "Next": "TriggerVideo"}],
                    "Next": "NotifyN8n"
                  },
                  "NotifyN8n": {
                    "Type": "Task",
                    "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${NotifyArn}",
                      "Payload": {
                        "private_ip.$": "$.n8nHost.Reservations[0].Instances[0].PrivateIpAddress",
                        "owner.$": "$.detail.owner",
                        "name.$": "$.detail.name",
                        "release_tag.$": "$.detail.release_tag"
                      }
                    },
                    "ResultPath": "$.n8nNotify",
                    "Catch": [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.n8nError", "Next": "TriggerVideo"}],
                    "Next": "TriggerVideo"
                  },
              - InstanceId: !Ref N8nInstanceId
                NotifyArn: !GetAtt NotifyN8nFunction.Arn
            - ""
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  ContentStateMachineArn:
    Description: Content generation state machine (started by manual-trigger / POST /process).
    Value: !Ref ContentStateMachine
    Export:
      Name: !Sub "${ProjectName}-ContentStateMachineArn"
  EcrRepositoryUri:
    Description: ECR repo deploy.yml pushes the content-runner image to.
    Value: !GetAtt EcrRepository.RepositoryUri
  PublishApiUrl:
    Condition: EnablePublish
    Description: HTTP API endpoint the n8n Approval Poller POSTs to on /approve (POST /publish with X-Publish-Secret).
    Value: !Sub "https://${PublishApi}.execute-api.${AWS::Region}.amazonaws.com/publish"
