AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AI Platform Base AMI - reusable Launch Template (Milestone 20). A drop-in,
  project-agnostic Launch Template that consumes the shared base AMI id from SSM
  Parameter Store (so it always launches the current golden image), enforces
  IMDSv2, encrypts the root volume, and wires the CloudWatch/SSM agents. Downstream
  projects reference this template (or copy it) and pass their own security group,
  instance profile, and startup snippet - no AMI id is ever hard-coded.

Parameters:
  PlatformName:
    Type: String
    Default: ai-platform
  BaseAmiParameter:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /ai-platform/ami/base/latest
    Description: >
      SSM parameter that resolves to the current shared base AMI id. Defaults to
      the registry stack's /ai-platform/ami/base/latest.
  InstanceType:
    Type: String
    Default: t3.large
    Description: Default instance type (override per project/workload).
  InstanceProfileArn:
    Type: String
    Default: ""
    Description: >
      ARN of the consuming project's IAM instance profile (least privilege). Leave
      empty to omit and attach one at launch.
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Shared/project security group for launched instances.
  RootVolumeSize:
    Type: Number
    Default: 40
    MinValue: 30
    Description: Root EBS volume size (GiB).
  StartupSnippet:
    Type: String
    Default: "echo 'no project startup snippet provided'"
    Description: >
      Optional project-specific shell run at first boot AFTER the base startup
      hook. Keep small - heavy dependencies belong in the baked image or a child AMI.

Conditions:
  HasInstanceProfile: !Not [!Equals [!Ref InstanceProfileArn, ""]]

Resources:
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${PlatformName}-base-lt"
      LaunchTemplateData:
        ImageId: !Ref BaseAmiParameter
        InstanceType: !Ref InstanceType
        # IMDSv2 required, single hop - hardening carried from the baked image
        # through to every launch.
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        IamInstanceProfile:
          !If
            - HasInstanceProfile
            - Arn: !Ref InstanceProfileArn
            - !Ref AWS::NoValue
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: !Ref RootVolumeSize
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        Monitoring:
          Enabled: true
        SecurityGroupIds:
          - !Ref SecurityGroupId
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: !Ref PlatformName
              - Key: BaseImage
                Value: ai-platform-base
              - Key: ManagedBy
                Value: launch-template
        UserData:
          Fn::Base64: !Sub |
            #!/usr/bin/env bash
            set -euxo pipefail
            # The base AMI already has Docker/Ollama/Go/Python/agents installed and
            # a first-boot hook at /opt/ai-platform/startup.sh. Start the agents,
            # then run the project snippet.
            systemctl start amazon-cloudwatch-agent || true
            mkdir -p /opt/ai-platform/startup.d
            cat >/opt/ai-platform/startup.d/10-project.sh <<'PROJECT'
            ${StartupSnippet}
            PROJECT
            chmod +x /opt/ai-platform/startup.d/10-project.sh
            systemctl start ai-platform-startup.service || /opt/ai-platform/startup.sh

Outputs:
  LaunchTemplateId:
    Description: Reusable base Launch Template id.
    Value: !Ref LaunchTemplate
    Export:
      Name: !Sub "${PlatformName}-base-launch-template-id"
  LaunchTemplateLatestVersion:
    Description: Latest version number of the Launch Template.
    Value: !GetAtt LaunchTemplate.LatestVersionNumber
    Export:
      Name: !Sub "${PlatformName}-base-launch-template-version"
