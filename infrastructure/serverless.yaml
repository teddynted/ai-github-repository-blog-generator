AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub AI Blog Generator - Serverless stack. The always-available front door:
  REST API Gateway (registration + manual /process + release-context routes),
  three Lambdas (registration, manual-trigger, release-context), the Step
  Functions orchestration state machine, the SQS events queue + dead-letter
  queue, the DynamoDB metadata table, and one shared Secrets Manager secret
  holding every repository's credentials (keyed by owner/name). POST /process
  starts a state-machine execution that starts the compute host, waits for it to
  report ready via SSM, and enqueues the job onto SQS for the worker to drain.
  GitHub PATs live in Secrets Manager under a fixed prefix (created at
  registration time, not by this stack).

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix, tag value, and Secrets Manager prefix root.
  ArtifactsBucket:
    Type: String
    Description: S3 bucket holding the Lambda deployment packages (bootstrap zips).
  RegistrationCodeKey:
    Type: String
    Default: registration.zip
    Description: S3 key of the registration Lambda package.
  ManualTriggerCodeKey:
    Type: String
    Default: manual-trigger.zip
    Description: S3 key of the manual-trigger Lambda package (POST /process).
  ReleaseContextCodeKey:
    Type: String
    Default: release-context.zip
    Description: S3 key of the release-context Lambda package (POST /release-context).
  ContentStateMachineArn:
    Type: String
    Default: ""
    Description: >
      When set, POST /process starts this serverless GenerateContent state machine
      (from the content stack) instead of the EC2 orchestration machine. Blank keeps
      the orchestration path — the cutover to serverless generation is a config flip.
  GitHubReadToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Optional GitHub token for the Release Context Builder to read repositories
      and releases. Blank works for public repositories (rate-limited); provide a
      least-privilege read token for private repos or higher rate limits.
  PublishTrigger:
    Type: String
    Default: "blog:"
    Description: Default commit-message trigger (per-repo overrides live in metadata).
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name.
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: Retention for the Lambda CloudWatch log groups.
  RegistrationReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Reserved concurrency for the registration Lambda — set to 1 to make it a
      single writer for the shared credentials secret (strongest lost-update
      protection). Left 0 (unset) by default because reserving concurrency
      requires the account's Lambda concurrency limit to be high enough to keep
      >= 10 unreserved; on low-limit accounts a value of 1 fails to deploy.
      When 0, the store's read-modify-write retry provides best-effort safety
      (registration is a rare, typically-serial admin operation).

Conditions:
  SetRegistrationConcurrency: !Not [!Equals [!Ref RegistrationReservedConcurrency, 0]]

Resources:
  # ---------------------------------------------------------------------------
  # Metadata store & event plumbing
  # ---------------------------------------------------------------------------
  RepositoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-repositories"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repo_full_name
          AttributeType: S
      KeySchema:
        - AttributeName: repo_full_name
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # One shared secret holds every repository's credentials as a JSON object
  # keyed by "<owner>/<name>": {"octocat/widget": {"pat":…,"webhook_secret":…}}.
  # Registration read-modify-writes this secret; the webhook handler and worker
  # read it. Created with an empty document; CloudFormation never rewrites the
  # value on later updates (the template value stays "{}"), so entries persist.
  RepoCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/github/repositories"
      Description: Shared GitHub credentials for all registered repositories (JSON, keyed by owner/name).
      SecretString: "{}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # (Phase B) The EventsQueue + DLQ and the OrchestrationStateMachine that fed
  # them are removed — POST /process now starts the serverless GenerateContent
  # (Fargate) machine directly, with no EC2 worker to buffer for.

  # ---------------------------------------------------------------------------
  # IAM roles (least privilege, one per function)
  # ---------------------------------------------------------------------------
  RegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: registration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read + write ONLY the single shared credentials secret. No
              # create/delete of per-repo secrets any more.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Ref RepoCredentialsSecret
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt RepositoriesTable.Arn

  # The manual-trigger Lambda (POST /process) only starts a state-machine
  # execution; the machine owns the compute-host lifecycle and SQS enqueue.
  ManualTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: manual-trigger
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                # The serverless content machine (from the content stack) — a
                # deterministic name, so no cross-stack import/ordering needed.
                Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-content"

  ReleaseContextRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: release-context
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Persist built Release Contexts under a dedicated prefix in the
              # artifacts bucket. GitHub is read over the internet (no AWS perms).
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactsBucket}/release-contexts/*"

  # ---------------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------------
  # Lambda log groups are declared here (with the functions) rather than in the
  # observability stack, so CloudFormation owns them before a function can run
  # and auto-create /aws/lambda/<fn> itself (which would collide on deploy).
  RegistrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-registration"
      RetentionInDays: !Ref LogRetentionDays
  ManualTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-manual-trigger"
      RetentionInDays: !Ref LogRetentionDays
  ReleaseContextLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-release-context"
      RetentionInDays: !Ref LogRetentionDays

  RegistrationFunction:
    Type: AWS::Lambda::Function
    DependsOn: RegistrationLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-registration"
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      # Optional single-writer serialization for the shared credentials secret.
      # Set RegistrationReservedConcurrency=1 to enable (needs account concurrency
      # headroom, see the parameter); otherwise unset and the store's
      # read-modify-write retry provides best-effort protection.
      ReservedConcurrentExecutions: !If [SetRegistrationConcurrency, !Ref RegistrationReservedConcurrency, !Ref "AWS::NoValue"]
      Role: !GetAtt RegistrationRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref RegistrationCodeKey
      Environment:
        Variables:
          REPOSITORIES_TABLE: !Ref RepositoriesTable
          REPO_SECRET_ID: !Ref RepoCredentialsSecret
          PUBLISH_TRIGGER: !Ref PublishTrigger
          # WEBHOOK_URL is intentionally unset: GitHub webhook ingress was
          # removed, so registration onboards credentials + metadata only and
          # does not create a GitHub webhook.
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ManualTriggerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ManualTriggerLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-manual-trigger"
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 10
      Role: !GetAtt ManualTriggerRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref ManualTriggerCodeKey
      Environment:
        Variables:
          # POST /process starts the serverless GenerateContent state machine
          # (Phase B removed the EC2 orchestration path). CONTENT_STATE_MACHINE_ARN
          # must be set (deploy.yml passes it when CUTOVER_CONTENT=true).
          CONTENT_STATE_MACHINE_ARN: !Ref ContentStateMachineArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ReleaseContextFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReleaseContextLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-release-context"
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      # Building a context makes several GitHub calls and assembles JSON, so it
      # gets more memory and a longer timeout than the thin trigger Lambdas.
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ReleaseContextRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref ReleaseContextCodeKey
      Environment:
        Variables:
          # Persisted Release Contexts land in the artifacts bucket under
          # release-contexts/<date>/<id>.json (see the role's scoped s3:PutObject).
          CONTEXT_BUCKET: !Ref ArtifactsBucket
          # Optional GitHub read token; blank works for public repositories.
          GITHUB_TOKEN: !Ref GitHubReadToken
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------------------------------------------------------------------------
  # REST API Gateway: /repositories (registration), /process (Step Functions
  # trigger), /release-context — all API-key protected.
  # ---------------------------------------------------------------------------
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-api"
      Description: Repository registration and manual processing trigger.
      EndpointConfiguration:
        Types: [REGIONAL]

  RepositoriesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: repositories

  ProcessResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: process

  ReleaseContextResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: release-context

  RepositoriesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RepositoriesResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegistrationFunction.Arn}/invocations"

  # DELETE /repositories deregisters a repo (removes its shared-secret entry,
  # webhook, and metadata). Same Lambda; it routes on the HTTP method.
  RepositoriesDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RepositoriesResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegistrationFunction.Arn}/invocations"

  # POST /process — the manual trigger. Secured with an API key (x-api-key),
  # the same simple scheme as the registration route, and covered by the shared
  # usage plan on this stage. Not publicly accessible without the key.
  ProcessMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProcessResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ManualTriggerFunction.Arn}/invocations"

  ProcessInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManualTriggerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/process"

  # POST /release-context — the Content Intelligence entrypoint (Milestone 2).
  # API-key protected like /process and /repositories, on the shared usage plan.
  ReleaseContextMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ReleaseContextResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReleaseContextFunction.Arn}/invocations"

  ReleaseContextInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReleaseContextFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/release-context"

  RegistrationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RegistrationFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # POST (register/update) and DELETE (deregister) both invoke the function.
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/repositories"

  # A Deployment is an immutable snapshot of the API. Changing methods does NOT
  # redeploy an existing Deployment (same logical id = no-op), so the stage would
  # keep serving the old set. Bump the logical id (…V4, V5, …) whenever methods
  # change to force a fresh snapshot — V5 removes /webhook.
  ApiDeploymentV5:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - RepositoriesMethod
      - RepositoriesDeleteMethod
      - ProcessMethod
      - ReleaseContextMethod
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub "Deployment for ${StageName} (repositories POST+DELETE, process, release-context)"

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeploymentV5
      StageName: !Ref StageName

  RegistrationApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub "${ProjectName}-registration-key"
      Enabled: true

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub "${ProjectName}-usage-plan"
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref ApiStage

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RegistrationApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  RegistrationUrl:
    Description: Repository registration endpoint (requires x-api-key).
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/repositories"
    Export:
      Name: !Sub "${ProjectName}-RegistrationUrl"
  ProcessUrl:
    Description: Manual processing trigger endpoint (POST, requires x-api-key).
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/process"
    Export:
      Name: !Sub "${ProjectName}-ProcessUrl"
  ReleaseContextUrl:
    Description: Release Context Builder endpoint (POST, requires x-api-key).
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/release-context"
    Export:
      Name: !Sub "${ProjectName}-ReleaseContextUrl"
  RegistrationApiKeyId:
    Description: API key ID for the registration + process endpoints (retrieve value via API Gateway).
    Value: !Ref RegistrationApiKey
  RepositoriesTableName:
    Description: DynamoDB metadata table.
    Value: !Ref RepositoriesTable
    Export:
      Name: !Sub "${ProjectName}-RepositoriesTableName"
  RepoCredentialsSecretArn:
    Description: ARN of the shared repository-credentials secret (worker reads it via the instance role).
    Value: !Ref RepoCredentialsSecret
    Export:
      Name: !Sub "${ProjectName}-RepoCredentialsSecretArn"
