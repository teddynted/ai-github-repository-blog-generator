AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Scheduled power management for an existing On-Demand EC2 instance. Two
  EventBridge Schedules (start + stop) invoke two Go Lambdas that start/stop a
  specific instance by ID on a timezone-aware cron. Defaults run the instance
  every evening, 7 days a week (Mon-Sun): start 18:00, stop 20:00. This gives
  weekend releases the same-evening processing as weekday releases. This schedule
  is the authority for instance availability. Idempotent, least-privilege, and
  independent of the blog-gen application stacks (it targets any instance ID).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Target instance }
        Parameters: [InstanceId, ProjectName, Environment]
      - Label: { default: Schedule }
        Parameters: [ScheduleTimezone, StartExpression, StopExpression, ScheduleState, ManageSchedules]
      - Label: { default: Lambda code + runtime }
        Parameters: [ArtifactsBucket, StartCodeKey, StopCodeKey, LambdaMemorySize, LambdaTimeout, LogRetentionDays]
      - Label: { default: Idle auto-stop (opt-in) }
        Parameters: [EnableIdleStop, IdleCodeKey, IdleEvalRate, IdleMinutes, CpuThreshold, StartupGraceMinutes, N8nUrl, N8nApiKey, OllamaUrl, IdleSnsTopicArn, IdleDryRun, IdleUseVpc, IdleSubnetIds, IdleSecurityGroupIds]
    ParameterLabels:
      InstanceId: { default: EC2 instance ID to start/stop }
      ScheduleTimezone: { default: IANA timezone for the cron expressions }

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix and Project tag value.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment tag applied to every resource.
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: ID of the existing EC2 instance the schedules start and stop.
  ScheduleTimezone:
    Type: String
    Default: Etc/UTC
    Description: >
      IANA timezone name the cron expressions are evaluated in (e.g.
      Africa/Johannesburg, Europe/London, America/New_York). Configurable so the
      18:00/20:00 window is local wall-clock time, not hardcoded UTC.
  StartExpression:
    Type: String
    Default: cron(0 18 ? * * *)
    Description: >
      EventBridge Scheduler expression for the daily START (default 18:00 every
      day, Mon-Sun). Day-of-month is '?' and day-of-week '*' so it fires all 7
      days; set a MON-FRI day-of-week only if a weekday-only window is intended.
  StopExpression:
    Type: String
    Default: cron(0 20 ? * * *)
    Description: >
      EventBridge Scheduler expression for the daily STOP (default 20:00 every
      day, Mon-Sun). Keep the STOP window matching the START window's days to
      avoid leaving the instance running (cost) or off when expected.
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Set DISABLED to pause both schedules without deleting the stack.
  ManageSchedules:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set "false" to deploy only the Lambdas + roles (e.g. to drive them
      manually) and skip creating the EventBridge Schedules.
  ArtifactsBucket:
    Type: String
    Description: S3 bucket holding the two Lambda deployment packages (zips).
  StartCodeKey:
    Type: String
    Default: scheduled-start.zip
    Description: S3 key of the scheduled-start Lambda package.
  StopCodeKey:
    Type: String
    Default: scheduled-stop.zip
    Description: S3 key of the scheduled-stop Lambda package.
  LambdaMemorySize:
    Type: Number
    Default: 128
    MinValue: 128
    MaxValue: 512
    Description: Memory (MB) for both Lambdas; 128 is ample for a single EC2 API call.
  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 120
    Description: Timeout (seconds) for both Lambdas; covers describe + start/stop with retries.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: Retention for the Lambda CloudWatch log groups.

  # --- Idle auto-stop (opt-in alternative to the fixed StopSchedule) -----------
  EnableIdleStop:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Set "true" to create an idle-detection Lambda that stops the instance only
      after IdleMinutes of low CPU/network and no active n8n/Ollama work. When
      enabled, set ScheduleState=DISABLED (or ManageSchedules=false) so the fixed
      StopSchedule does not also stop the instance.
  IdleCodeKey:
    Type: String
    Default: idle-stop.zip
    Description: S3 key of the idle-stop Lambda package.
  IdleEvalRate:
    Type: String
    Default: rate(1 hour)
    Description: How often the idle check runs (EventBridge rate expression).
  IdleMinutes:
    Type: Number
    Default: 30
    Description: Sustained idle duration before the instance is stopped.
  CpuThreshold:
    Type: String
    Default: "5"
    Description: CPUUtilization percent below which the instance counts as idle.
  StartupGraceMinutes:
    Type: Number
    Default: 15
    Description: Never stop within this many minutes of the instance's launch time.
  N8nUrl:
    Type: String
    Default: ""
    Description: Base URL of n8n (e.g. http://10.0.1.20:5678); empty disables the n8n check. Requires IdleUseVpc.
  N8nApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: n8n public-API key for the executions check.
  OllamaUrl:
    Type: String
    Default: ""
    Description: Base URL of Ollama (e.g. http://10.0.1.20:11434); empty disables the Ollama check. Requires IdleUseVpc.
  IdleSnsTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for a pre-stop notification.
  IdleDryRun:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: When "true" the Lambda logs the stop decision but does not stop the instance. Flip to "false" after validating logs.
  IdleUseVpc:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Attach the Lambda to a VPC so it can reach the instance's private n8n/Ollama ports. Required for the app-level checks.
  IdleSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Subnet IDs for the Lambda ENI (only when IdleUseVpc=true).
  IdleSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Security groups allowing the Lambda to reach the instance on 5678/11434 (only when IdleUseVpc=true).

Conditions:
  # Lets operators deploy just the functions (ManageSchedules=false) and drive
  # start/stop manually, without the two EventBridge Schedules.
  CreateSchedules: !Equals [!Ref ManageSchedules, "true"]
  # Idle auto-stop is opt-in; nested conditions gate the SNS statement and the
  # VpcConfig so neither is emitted unless configured.
  CreateIdleStop: !Equals [!Ref EnableIdleStop, "true"]
  IdleWithSns: !And [!Condition CreateIdleStop, !Not [!Equals [!Ref IdleSnsTopicArn, ""]]]
  IdleWithVpc: !And [!Condition CreateIdleStop, !Equals [!Ref IdleUseVpc, "true"]]

Resources:
  # ---------------------------------------------------------------------------
  # CloudWatch log groups (declared explicitly so retention is managed and the
  # group exists before the function first writes to it).
  # ---------------------------------------------------------------------------
  StartLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-scheduled-start"
      RetentionInDays: !Ref LogRetentionDays

  StopLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-scheduled-stop"
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # IAM execution roles (least privilege, one per function). ec2:Start/Stop are
  # scoped to the single target instance ARN; ec2:DescribeInstances cannot be
  # resource-scoped so it is granted on "*" (read-only, no state change).
  # ---------------------------------------------------------------------------
  StartFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-scheduled-start-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartTargetInstance
                Effect: Allow
                Action: ec2:StartInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
              - Sid: DescribeInstances
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  StopFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-scheduled-stop-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: stop-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StopTargetInstance
                Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
              - Sid: DescribeInstances
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # Role EventBridge Scheduler assumes to invoke the Lambdas. Scoped to this
  # account (confused-deputy guard) and to only these two function ARNs.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Condition: CreateSchedules
    Properties:
      RoleName: !Sub "${ProjectName}-scheduler-invoke-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-power-lambdas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt StartFunction.Arn
                  - !GetAtt StopFunction.Arn
              # Deliver invocations that exhaust the retry policy to the DLQ.
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDLQ.Arn
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # Dead-letter queue for schedule invocations that fail past the retry policy —
  # gives durable failure visibility beyond the CloudWatch error alarms. Encrypted,
  # 14-day retention for forensics.
  SchedulerDLQ:
    Type: AWS::SQS::Queue
    Condition: CreateSchedules
    Properties:
      QueueName: !Sub "${ProjectName}-scheduler-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------------------
  # Lambda functions (Go, provided.al2023, arm64).
  # ---------------------------------------------------------------------------
  StartFunction:
    Type: AWS::Lambda::Function
    DependsOn: StartLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-scheduled-start"
      Description: Starts the target EC2 instance on the daily start schedule.
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt StartFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref StartCodeKey
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          INSTANCE_ID: !Ref InstanceId
          LOG_LEVEL: info
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  StopFunction:
    Type: AWS::Lambda::Function
    DependsOn: StopLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-scheduled-stop"
      Description: Stops the target EC2 instance on the daily stop schedule.
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt StopFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref StopCodeKey
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          INSTANCE_ID: !Ref InstanceId
          LOG_LEVEL: info
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  # ---------------------------------------------------------------------------
  # EventBridge Schedules. ScheduleExpressionTimezone evaluates the cron in the
  # configured IANA timezone; FlexibleTimeWindow OFF fires at the exact minute.
  # The RetryPolicy hardens against a transient Lambda-invoke failure.
  # ---------------------------------------------------------------------------
  StartSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: CreateSchedules
    Properties:
      Name: !Sub "${ProjectName}-scheduled-start"
      Description: Daily start of the target EC2 instance (default 18:00, 7 days a week).
      State: !Ref ScheduleState
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref StartExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      Target:
        Arn: !GetAtt StartFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDLQ.Arn

  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: CreateSchedules
    Properties:
      Name: !Sub "${ProjectName}-scheduled-stop"
      Description: Daily stop of the target EC2 instance (default 20:00, 7 days a week).
      State: !Ref ScheduleState
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref StopExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      Target:
        Arn: !GetAtt StopFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDLQ.Arn

  # ---------------------------------------------------------------------------
  # Idle auto-stop (opt-in): a Lambda polled hourly by an EventBridge rule that
  # stops the instance only after sustained idleness across CPU, network, and
  # (optionally) n8n/Ollama activity checks. Independent of the start path and
  # the fixed StopSchedule.
  # ---------------------------------------------------------------------------
  IdleStopLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateIdleStop
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-idle-stop"
      RetentionInDays: !Ref LogRetentionDays

  IdleStopFunctionRole:
    Type: AWS::IAM::Role
    Condition: CreateIdleStop
    Properties:
      RoleName: !Sub "${ProjectName}-idle-stop-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        !If
          - IdleWithVpc
          - - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
          - - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: idle-stop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StopAndTagTargetInstance
                Effect: Allow
                Action: [ec2:StopInstances, ec2:CreateTags, ec2:DeleteTags]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}"
              - Sid: DescribeInstances
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Sid: ReadMetrics
                Effect: Allow
                Action: cloudwatch:GetMetricData
                Resource: "*"
              - !If
                - IdleWithSns
                - Sid: NotifyBeforeStop
                  Effect: Allow
                  Action: sns:Publish
                  Resource: !Ref IdleSnsTopicArn
                - !Ref AWS::NoValue
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  IdleStopFunction:
    Type: AWS::Lambda::Function
    Condition: CreateIdleStop
    DependsOn: IdleStopLogGroup
    Metadata:
      # The VpcConfig subnet/SG lists are only referenced under IdleWithVpc; with
      # IdleUseVpc=false their empty CommaDelimitedList default is never used, but
      # cfn-lint resolves the Ref statically and flags the empty value (W1030).
      cfn-lint:
        config:
          ignore_checks: [W1030]
    Properties:
      FunctionName: !Sub "${ProjectName}-idle-stop"
      Description: Stops the target EC2 instance after sustained idleness.
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt IdleStopFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref IdleCodeKey
      VpcConfig:
        !If
          - IdleWithVpc
          - SubnetIds: !Ref IdleSubnetIds
            SecurityGroupIds: !Ref IdleSecurityGroupIds
          - !Ref AWS::NoValue
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          INSTANCE_ID: !Ref InstanceId
          CPU_THRESHOLD: !Ref CpuThreshold
          IDLE_MINUTES: !Ref IdleMinutes
          STARTUP_GRACE_MINUTES: !Ref StartupGraceMinutes
          N8N_URL: !Ref N8nUrl
          N8N_API_KEY: !Ref N8nApiKey
          OLLAMA_URL: !Ref OllamaUrl
          SNS_TOPIC_ARN: !Ref IdleSnsTopicArn
          DRY_RUN: !Ref IdleDryRun
          LOG_LEVEL: info
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }

  IdleStopRule:
    Type: AWS::Events::Rule
    Condition: CreateIdleStop
    Properties:
      Name: !Sub "${ProjectName}-idle-stop"
      Description: Polls instance idleness and stops it when idle long enough.
      ScheduleExpression: !Ref IdleEvalRate
      State: !Ref ScheduleState
      Targets:
        - Id: idle-stop
          Arn: !GetAtt IdleStopFunction.Arn

  IdleStopInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateIdleStop
    Properties:
      FunctionName: !Ref IdleStopFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IdleStopRule.Arn

Outputs:
  StartFunctionArn:
    Description: ARN of the start Lambda (invoke manually to force a start).
    Value: !GetAtt StartFunction.Arn
  StopFunctionArn:
    Description: ARN of the stop Lambda (invoke manually to force a stop).
    Value: !GetAtt StopFunction.Arn
  StartScheduleName:
    Condition: CreateSchedules
    Description: Name of the daily start schedule.
    Value: !Ref StartSchedule
  StopScheduleName:
    Condition: CreateSchedules
    Description: Name of the daily stop schedule.
    Value: !Ref StopSchedule
  ScheduleWindow:
    Description: Human-readable summary of the configured on/off window.
    Value: !Sub "start '${StartExpression}' / stop '${StopExpression}' (${ScheduleTimezone}), state=${ScheduleState}"
  IdleStopFunctionArn:
    Condition: CreateIdleStop
    Description: ARN of the idle-stop Lambda (invoke manually to force an idle check).
    Value: !GetAtt IdleStopFunction.Arn
  SchedulerDLQUrl:
    Condition: CreateSchedules
    Description: Dead-letter queue for failed schedule invocations (inspect on alarm).
    Value: !Ref SchedulerDLQ
