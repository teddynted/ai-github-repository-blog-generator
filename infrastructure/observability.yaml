AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub AI Blog Generator - Observability stack. CloudWatch log groups with
  bounded retention for the four Lambdas and the instance, an SNS alarm topic,
  failure alarms (Lambda errors, dead-letter queue, queue backlog, API 5XX),
  and an operational dashboard. Deploy after the serverless and compute stacks.

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix (must match the other stacks).
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name (for the 5XX alarm dimension).
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch log retention (days).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to the alarm topic (leave blank to skip).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # --- Log groups (bounded retention) ---
  # The Lambda log groups (/aws/lambda/<fn>) are declared in the serverless stack
  # alongside the functions, so CloudFormation owns them before a function can
  # auto-create its own (which collided on deploy). Only the instance group lives
  # here.
  InstanceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${ProjectName}/instance"
      RetentionInDays: !Ref LogRetentionDays

  # --- Alarms ---
  ManualTriggerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-manual-trigger-errors"
      AlarmDescription: Manual trigger (POST /process) is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-manual-trigger"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Power is owned by the scheduler stack (daily window, 7 days a week). These
  # alarms watch the two functions that start/stop the instance. Their functions
  # live in the scheduler stack; CloudWatch alarms key off the metric dimension
  # (function name) so they work across stacks.
  ScheduledStartErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-scheduled-start-errors"
      AlarmDescription: Scheduled-start is failing - the instance may not come up for its window.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-scheduled-start"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ScheduledStopErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-scheduled-stop-errors"
      AlarmDescription: Scheduled-stop is failing - the instance may not stop at 20:00 (cost risk).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-scheduled-stop"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Scheduler invocations that fail past the retry policy (e.g. the Scheduler
  # cannot invoke the Lambda at all) land in the scheduler stack's DLQ. This
  # catches failures that never surface as a Lambda error metric.
  SchedulerDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-scheduler-dlq-not-empty"
      AlarmDescription: A start/stop schedule invocation failed past its retries and was dead-lettered.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub "${ProjectName}-scheduler-dlq"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # (Phase B) The events-queue DLQ + backlog alarms are removed with the SQS
  # queue itself — POST /process now runs serverless (no EC2 worker / SQS).
  # The scheduler's own DLQ alarm (above) stays.

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-api-5xx"
      AlarmDescription: API Gateway is returning 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${ProjectName}-api"
        - Name: Stage
          Value: !Ref StageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  RunsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-runs-failed"
      AlarmDescription: Content-generation runs are failing.
      Namespace: BlogGenerator
      MetricName: RunsFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-ops"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ProjectName}-registration" ],
                  [ "...", "${ProjectName}-manual-trigger" ],
                  [ "...", "${ProjectName}-scheduled-start" ],
                  [ "...", "${ProjectName}-scheduled-stop" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Webhook activity (triggered vs ignored)",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "BlogGenerator", "WebhookReceived" ],
                  [ "BlogGenerator", "TriggerMatched" ],
                  [ "BlogGenerator", "WebhookIgnored" ],
                  [ "BlogGenerator", "WebhookRejected" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Run outcomes",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "BlogGenerator", "RunsStarted" ],
                  [ "BlogGenerator", "RunsSucceeded" ],
                  [ "BlogGenerator", "RunsFailed" ],
                  [ "BlogGenerator", "RunsHeld" ],
                  [ "BlogGenerator", "AssetsGenerated" ]
                ]
              }
            }
          ]
        }

Outputs:
  AlarmTopicArn:
    Description: SNS topic for alarms.
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub "${ProjectName}-AlarmTopicArn"
  DashboardName:
    Description: Operational dashboard.
    Value: !Sub "${ProjectName}-ops"
