AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub AI Blog Generator - Observability stack. CloudWatch log groups with
  bounded retention for the four Lambdas and the instance, an SNS alarm topic,
  failure alarms (Lambda errors, dead-letter queue, queue backlog, API 5XX),
  and an operational dashboard. Deploy after the serverless and compute stacks.

Parameters:
  ProjectName:
    Type: String
    Default: blog-gen
    Description: Resource name prefix (must match the other stacks).
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name (for the 5XX alarm dimension).
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch log retention (days).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to the alarm topic (leave blank to skip).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # --- Log groups (bounded retention) ---
  RegistrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-registration"
      RetentionInDays: !Ref LogRetentionDays

  WebhookHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-webhook-handler"
      RetentionInDays: !Ref LogRetentionDays

  InstanceStarterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-instance-starter"
      RetentionInDays: !Ref LogRetentionDays

  IdleShutdownLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-idle-shutdown"
      RetentionInDays: !Ref LogRetentionDays

  InstanceLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${ProjectName}/instance"
      RetentionInDays: !Ref LogRetentionDays

  # --- Alarms ---
  WebhookHandlerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-webhook-handler-errors"
      AlarmDescription: Webhook handler is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-webhook-handler"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  InstanceStarterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-instance-starter-errors"
      AlarmDescription: Instance starter is failing - triggered runs may never start.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-instance-starter"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  IdleShutdownErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-idle-shutdown-errors"
      AlarmDescription: Idle-shutdown is failing - the instance may not stop (cost risk).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${ProjectName}-idle-shutdown"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-dlq-not-empty"
      AlarmDescription: Messages have landed in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub "${ProjectName}-events-dlq"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-queue-backlog"
      AlarmDescription: Oldest event has been waiting too long (instance not draining).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !Sub "${ProjectName}-events"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1800
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-api-5xx"
      AlarmDescription: API Gateway is returning 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${ProjectName}-api"
        - Name: Stage
          Value: !Ref StageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-ops"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ProjectName}-registration" ],
                  [ "...", "${ProjectName}-webhook-handler" ],
                  [ "...", "${ProjectName}-instance-starter" ],
                  [ "...", "${ProjectName}-idle-shutdown" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Events queue",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ProjectName}-events", { "stat": "Maximum" } ],
                  [ "AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${ProjectName}-events", { "stat": "Maximum" } ],
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ProjectName}-events-dlq", { "stat": "Maximum" } ]
                ]
              }
            }
          ]
        }

Outputs:
  AlarmTopicArn:
    Description: SNS topic for alarms.
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub "${ProjectName}-AlarmTopicArn"
  DashboardName:
    Description: Operational dashboard.
    Value: !Sub "${ProjectName}-ops"
