# GitHub AI Blog Generator - instance runtime.
#
# Runs on the On-Demand EC2 host (and locally for development). n8n orchestrates
# publishing/approval, backed by PostgreSQL (n8n + app state) and Redis
# (queue/cache). There is NO local model: content is generated by the worker via
# the AI Provider Router (Amazon Bedrock -> Anthropic). State lives under /data,
# which on the instance is the persistent gp3 EBS volume so it survives
# start/stop cycles.
#
# n8n (5678) is not exposed publicly - reach it via an SSH tunnel.
# See docs/local-development.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      POSTGRES_DB: n8n
    volumes:
      - /data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /data/redis:/data

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - QUEUE_BULL_REDIS_HOST=redis
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - /data/n8n:/home/node/.n8n
