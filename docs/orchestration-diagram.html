<title>AI Blog Generation — n8n-Style Workflow</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FAFAFB; --panel: #F3F3F6; --ink: #23232B; --muted: #6B6F7C; --grid: #DCDCE4;
    --card: #FFFFFF; --card-bd: #E2E2EA; --card-sh: rgba(20,20,40,0.10);
    --wire: #B9BCC7; --wire-strong: #9A9EAC; --dot: #C4C7D2;
    --section: rgba(234,75,113,0.05); --section-bd: rgba(234,75,113,0.28);
    --sticky: #FFF7D6; --sticky-bd: #F1E4A6; --sticky-ink: #6B5B12; --hair: rgba(20,20,40,0.10);
    --n8n: #EA4B71; --github: #F59E0B; --aws: #2563EB; --ai: #7C3AED; --pub: #10B981; --store: #64748B; --artifact: #6366F1;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1B1B22;--panel:#23232D;--ink:#E7E8F0;--muted:#9A9EAE;--grid:rgba(255,255,255,0.06);
      --card:#2A2B36;--card-bd:#3A3B48;--card-sh:rgba(0,0,0,0.5);
      --wire:#4C4E5C;--wire-strong:#6A6D7E;--dot:#5A5D6E;
      --section:rgba(234,75,113,0.09);--section-bd:rgba(234,75,113,0.36);
      --sticky:#3A3620;--sticky-bd:#55502F;--sticky-ink:#E6D98F;--hair:rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="light"]{--bg:#FAFAFB;--panel:#F3F3F6;--ink:#23232B;--muted:#6B6F7C;--grid:#DCDCE4;--card:#FFFFFF;--card-bd:#E2E2EA;--card-sh:rgba(20,20,40,0.10);--wire:#B9BCC7;--wire-strong:#9A9EAC;--dot:#C4C7D2;--section:rgba(234,75,113,0.05);--section-bd:rgba(234,75,113,0.28);--sticky:#FFF7D6;--sticky-bd:#F1E4A6;--sticky-ink:#6B5B12;--hair:rgba(20,20,40,0.10);}
  :root[data-theme="dark"]{--bg:#1B1B22;--panel:#23232D;--ink:#E7E8F0;--muted:#9A9EAE;--grid:rgba(255,255,255,0.06);--card:#2A2B36;--card-bd:#3A3B48;--card-sh:rgba(0,0,0,0.5);--wire:#4C4E5C;--wire-strong:#6A6D7E;--dot:#5A5D6E;--section:rgba(234,75,113,0.09);--section-bd:rgba(234,75,113,0.36);--sticky:#3A3620;--sticky-bd:#55502F;--sticky-ink:#E6D98F;--hair:rgba(255,255,255,0.10);}

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; padding: clamp(14px,2.5vw,32px); }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: var(--n8n); padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--n8n) 12%, transparent); border: 1px solid color-mix(in srgb, var(--n8n) 34%, transparent); }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--n8n); box-shadow: 0 0 10px var(--n8n); }
  h1 { font-size: clamp(21px,3.2vw,30px); line-height: 1.1; letter-spacing: -0.02em; margin: 12px 0 5px; font-weight: 700; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0; }
  .sub code { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--panel); border: 1px solid var(--hair); }
  .themetoggle { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--hair); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .themetoggle:hover { color: var(--ink); border-color: var(--wire-strong); }
  .themetoggle:focus-visible { outline: 2px solid var(--n8n); outline-offset: 2px; }

  .stage { border: 1px solid var(--hair); border-radius: 14px; overflow: auto; background: var(--bg); box-shadow: 0 24px 60px -40px var(--card-sh); }
  svg { display: block; width: 100%; height: auto; margin: 0 auto; }

  .card-body { fill: var(--card); stroke: var(--card-bd); stroke-width: 1.4; }
  .card-sh { fill: #000; }
  .n-title { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .n-sub { fill: var(--muted); font-size: 10px; font-weight: 500; }
  .tile-t { fill: #fff; font-family: var(--mono); font-size: 12px; font-weight: 700; }
  .lane-label { fill: var(--n8n); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .sticky-h { fill: var(--sticky-ink); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .sticky-t { fill: var(--sticky-ink); font-size: 12px; font-weight: 600; }
  .wire-lbl { fill: var(--muted); font-size: 10px; font-weight: 600; }

  .wire { fill: none; stroke: var(--wire-strong); stroke-width: 2; }
  .wire.dashed { stroke: var(--wire); stroke-width: 1.7; stroke-dasharray: 5 5; }
  .wire.mon { stroke: var(--store); stroke-width: 1.5; stroke-dasharray: 2 6; opacity: .7; }
  .dot { fill: var(--dot); }
  .dot.coral { fill: var(--n8n); }

  .footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; font-style: italic; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin-top: 16px; }
  .legend .item { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .legend .sw { width: 12px; height: 12px; border-radius: 4px; }

  .grp { opacity: 0; }
  svg.loaded .grp { opacity: 1; transition: opacity .45s ease; }
  svg.loaded .wire { opacity: 0; animation: win .5s ease forwards; }
  @keyframes win { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .grp { opacity: 1; } svg.loaded .grp { transition: none; } svg.loaded .wire { opacity: 1; animation: none; } }
</style>

<div class="wrap">
  <div class="topbar">
    <div>
      <span class="eyebrow"><span class="dot"></span>Event-Driven AI Content Workflow</span>
      <h1>AI Blog Generation &amp; Agent Orchestration</h1>
      <p class="sub">n8n-style workflow · <code>teddynted/ai-github-repository-blog-generator</code></p>
    </div>
    <button class="themetoggle" id="themetoggle" aria-label="Toggle color theme">◐ Theme</button>
  </div>

  <div class="stage">
    <svg id="diagram" viewBox="0 0 1120 1800" role="img"
         aria-label="A top-to-bottom n8n-style workflow: GitHub webhook, release and actions triggers converge into EventBridge, then Lambda and SQS, then down through the AI Blog Orchestrator (Repository Analyzer, Content Intelligence, Prompt Orchestrator, Quality Gate) which calls Amazon Bedrock with an optional Ollama model, fans out to blog, visual, video and social artifacts, collects into Amazon S3, is published by n8n to GitHub pull requests and the blog platform, with CloudWatch monitoring the AWS steps.">
      <defs>
        <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1.3" cy="1.3" r="1.3" fill="var(--grid)"></circle>
        </pattern>
      </defs>
      <rect id="bg" x="0" y="0" width="1120" height="1800" fill="url(#grid)"></rect>
      <g id="layers"></g>
    </svg>
  </div>

  <div class="legend" id="legend"></div>
  <p class="footer">Generate once, publish everywhere.</p>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("diagram");
  const layers = document.getElementById("layers");
  const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) if (a[k] !== null) e.setAttribute(k, a[k]); return e; };
  const COLOR = { n8n:"var(--n8n)", github:"var(--github)", aws:"var(--aws)", ai:"var(--ai)", pub:"var(--pub)", store:"var(--store)", artifact:"var(--artifact)" };

  const N = {
    WH:  { fam:"n8n", mono:"⚡", t:"GitHub Webhook", s:"push event",     trig:true },
    REL: { fam:"n8n", mono:"⚡", t:"GitHub Release", s:"release event",  trig:true },
    GHA: { fam:"n8n", mono:"⚡", t:"GitHub Actions", s:"workflow event", trig:true },
    EB:  { fam:"aws", mono:"EB",  t:"Amazon EventBridge", s:"event ingestion" },
    LWH: { fam:"aws", mono:"λ",   t:"AWS Lambda",         s:"webhook handler" },
    SQS: { fam:"aws", mono:"SQS", t:"Amazon SQS",         s:"queue · backpressure" },
    RA:  { fam:"ai", mono:"01", t:"Repository Analyzer",  s:"README · arch · diff" },
    CI:  { fam:"ai", mono:"02", t:"Content Intelligence", s:"SEO · summary · audience" },
    PO:  { fam:"ai", mono:"03", t:"Prompt Orchestrator",  s:"blog · diagram · social" },
    QG:  { fam:"ai", mono:"04", t:"Quality Gate",         s:"markdown · frontmatter" },
    BR:  { fam:"ai", mono:"BR", t:"Amazon Bedrock",       s:"Claude · Nova · Titan" },
    OL:  { fam:"ai", mono:"OL", t:"Ollama — optional",    s:"Llama 3 · DeepSeek", opt:true },
    BLOG:{ fam:"artifact", mono:"MD",  t:"Blog", s:"SEO · notes" },
    VIS: { fam:"artifact", mono:"SVG", t:"Visuals",  s:"AWS · Mermaid" },
    VID: { fam:"artifact", mono:"MP4", t:"Video",   s:"storyboard" },
    SOC: { fam:"artifact", mono:"SOC", t:"Social",  s:"LinkedIn · X" },
    S3:  { fam:"store", mono:"S3",  t:"Amazon S3", s:"draft storage" },
    N8N: { fam:"n8n",   mono:"n8n", t:"n8n",       s:"workflow automation" },
    PR:  { fam:"pub", mono:"PR",  t:"GitHub Pull Request", s:"human review" },
    SITE:{ fam:"pub", mono:"WEB", t:"Blog Platform",       s:"scheduled publish" },
    CW:  { fam:"store", mono:"CW", t:"Amazon CloudWatch", s:"logs · metrics · alarms" },
  };

  // ---- measure labels so cards fit (no overflow) ----
  const meas = el("text", { x:-9999, y:-9999, class:"n-title" });
  layers.appendChild(meas);
  const tw = (str, cls) => {
    meas.setAttribute("class", cls); meas.textContent = str;
    return Math.max(meas.getComputedTextLength(), str.length * (cls === "n-title" ? 7.4 : 5.6));
  };
  const H = 58, TILE = 38, PADL = 10, GAPX = 12, PADR = 18;
  const textX0 = PADL + TILE + GAPX;
  Object.values(N).forEach(n => { n.w = Math.max(140, Math.ceil(textX0 + Math.max(tw(n.t,"n-title"), tw(n.s,"n-sub")) + PADR)); n.h = H; });
  layers.removeChild(meas);

  // ---- vertical layout: rows top→bottom, multi-node rows spread horizontally ----
  const ROWS = [
    ["WH","REL","GHA"], ["EB"], ["LWH"], ["SQS"],
    ["RA"], ["CI"], ["PO"], ["QG"],
    ["BLOG","VIS","VID","SOC"], ["S3"], ["N8N"], ["PR","SITE"],
  ];
  const ROWGAP = 46, PITCH = 122, STARTY = 156, BUSX = 52;
  let maxHalf = 0;
  const rowTotal = r => r.reduce((s,id)=>s+N[id].w,0) + ROWGAP*(r.length-1);
  ROWS.forEach(r => maxHalf = Math.max(maxHalf, rowTotal(r)/2));
  const cx = BUSX + 56 + maxHalf;   // leave a left gutter for the telemetry bus
  ROWS.forEach((r, i) => {
    const y = STARTY + i * PITCH;
    let x = cx - rowTotal(r) / 2;
    r.forEach(id => { const n = N[id]; n.x = x + n.w/2; n.y = y; x += n.w + ROWGAP; });
  });
  // Bedrock / Ollama attached beside the Prompt Orchestrator (n8n AI-agent pattern)
  const brW = Math.max(N.BR.w, N.OL.w);
  const rightX = cx + N.PO.w/2 + 60 + brW/2;
  N.BR.x = rightX; N.BR.y = N.PO.y - 18;
  N.OL.x = rightX; N.OL.y = N.PO.y + 52;
  // CloudWatch at the bottom
  const lastY = STARTY + (ROWS.length - 1) * PITCH;
  N.CW.x = cx; N.CW.y = lastY + 128;

  const canvasW = Math.max(cx + maxHalf, N.BR.x + N.BR.w/2) + 44;
  const canvasH = N.CW.y + 70;
  svg.setAttribute("viewBox", `0 0 ${canvasW} ${canvasH}`);
  svg.style.maxWidth = canvasW + "px";
  const bg = document.getElementById("bg"); bg.setAttribute("width", canvasW); bg.setAttribute("height", canvasH);

  const L = n => n.x - n.w/2, R = n => n.x + n.w/2, T = n => n.y - n.h/2, B = n => n.y + n.h/2;

  // sticky note
  (function () {
    const g = el("g", { class:"grp" });
    g.appendChild(el("rect", { x:cx - maxHalf, y:44, width:266, height:60, rx:8, fill:"var(--sticky)", stroke:"var(--sticky-bd)", "stroke-width":1.2 }));
    const h = el("text", { x:cx - maxHalf + 14, y:66, class:"sticky-h" }); h.textContent = "Source"; g.appendChild(h);
    const l = el("text", { x:cx - maxHalf + 14, y:86, class:"sticky-t" }); l.textContent = "Developer → GitHub Repository"; g.appendChild(l);
    layers.appendChild(g);
  })();

  // orchestrator section (vertical box around RA..QG)
  (function () {
    const mh = Math.max(N.RA.w, N.CI.w, N.PO.w, N.QG.w) / 2;
    const x1 = cx - mh - 18, x2 = cx + mh + 18, y1 = T(N.RA) - 34, y2 = B(N.QG) + 16;
    const g = el("g", { class:"grp" });
    g.appendChild(el("rect", { x:x1, y:y1, width:x2 - x1, height:y2 - y1, rx:14, fill:"var(--section)", stroke:"var(--section-bd)", "stroke-width":1.4, "stroke-dasharray":"7 6" }));
    const t = el("text", { x:x1 + 16, y:y1 + 22, class:"lane-label" }); t.textContent = "AI BLOG ORCHESTRATOR"; g.appendChild(t);
    layers.appendChild(g);
  })();

  // ---- wires ----
  const dotAt = (x, y, coral) => layers.appendChild(el("circle", { cx:x, cy:y, r:3.6, class:"dot" + (coral ? " coral" : "") }));
  const vwire = (a, b, cls, coral) => {           // bottom of A -> top of B (vertical flow)
    const sx = a.x, sy = B(a), ex = b.x, ey = T(b), my = (sy + ey) / 2;
    layers.appendChild(el("path", { d:`M${sx},${sy} C${sx},${my} ${ex},${my} ${ex},${ey}`, class:"wire " + (cls || "") }));
    dotAt(sx, sy, coral); dotAt(ex, ey, false);
  };
  const hwire = (a, b, cls, coral) => {           // right of A -> left of B (side branch)
    const sx = R(a), sy = a.y, ex = L(b), ey = b.y, dx = Math.max(40, Math.abs(ex - sx) * 0.5);
    layers.appendChild(el("path", { d:`M${sx},${sy} C${sx + dx},${sy} ${ex - dx},${ey} ${ex},${ey}`, class:"wire " + (cls || "") }));
    dotAt(sx, sy, coral); dotAt(ex, ey, false);
  };

  vwire(N.WH, N.EB, "", true); vwire(N.REL, N.EB, "", true); vwire(N.GHA, N.EB, "", true);
  vwire(N.EB, N.LWH); vwire(N.LWH, N.SQS); vwire(N.SQS, N.RA);
  vwire(N.RA, N.CI); vwire(N.CI, N.PO); vwire(N.PO, N.QG);
  hwire(N.PO, N.BR); hwire(N.PO, N.OL, "dashed");
  vwire(N.QG, N.BLOG); vwire(N.QG, N.VIS); vwire(N.QG, N.VID); vwire(N.QG, N.SOC);
  vwire(N.BLOG, N.S3); vwire(N.VIS, N.S3); vwire(N.VID, N.S3); vwire(N.SOC, N.S3);
  vwire(N.S3, N.N8N, "", true);
  vwire(N.N8N, N.PR, "", true); vwire(N.N8N, N.SITE, "", true);

  // telemetry: left bus with taps into CloudWatch
  (function () {
    const taps = [N.LWH, N.SQS, N.QG, N.N8N];
    const topY = Math.min(...taps.map(n => n.y));
    layers.appendChild(el("path", { d:`M${BUSX},${topY} L${BUSX},${N.CW.y} L${L(N.CW)},${N.CW.y}`, class:"wire mon" }));
    taps.forEach(n => layers.appendChild(el("path", { d:`M${L(n)},${n.y} L${BUSX},${n.y}`, class:"wire mon" })));
    const tl = el("text", { x:BUSX - 2, y:topY - 12, class:"wire-lbl", "text-anchor":"start" }); tl.textContent = "telemetry"; layers.appendChild(tl);
  })();

  const wlbl = (x, y, txt, anchor) => { const t = el("text", { x, y, class:"wire-lbl", "text-anchor":anchor||"middle" }); t.textContent = txt; layers.appendChild(t); };
  wlbl(cx + 18, (B(N.SQS) + T(N.RA)) / 2 + 3, "async job", "start");
  wlbl((R(N.PO) + L(N.BR)) / 2, N.PO.y - 22, "ai model");
  wlbl(cx, T(N.CW) - 12, "monitors Lambda · SQS · Orchestrator · Bedrock · n8n");

  // ---- node cards ----
  const drawNode = (n) => {
    const g = el("g", { class:"grp" });
    const rx = 12;
    g.appendChild(el("rect", { x:L(n), y:T(n) + 3, width:n.w, height:n.h, rx, class:"card-sh", opacity:0.10 }));
    g.appendChild(el("rect", { x:L(n), y:T(n), width:n.w, height:n.h, rx, class:"card-body",
      style: n.trig ? "stroke: var(--n8n); stroke-width:1.6;" : (n.opt ? "stroke-dasharray:6 4;" : "") }));
    const tx = L(n) + PADL, ty = n.y - TILE / 2;
    g.appendChild(el("rect", { x:tx, y:ty, width:TILE, height:TILE, rx:9, fill:COLOR[n.fam] }));
    const mono = el("text", { x:tx + TILE / 2, y:n.y + 4, class:"tile-t", "text-anchor":"middle" }); mono.textContent = n.mono; g.appendChild(mono);
    const txx = L(n) + textX0;
    const tt = el("text", { x:txx, y:n.y - 3, class:"n-title", "text-anchor":"start" }); tt.textContent = n.t; g.appendChild(tt);
    const st = el("text", { x:txx, y:n.y + 13, class:"n-sub", "text-anchor":"start" }); st.textContent = n.s; g.appendChild(st);
    layers.appendChild(g);
  };
  Object.values(N).forEach(drawNode);

  layers.querySelectorAll(".grp").forEach((g, i) => g.style.transitionDelay = (i * 16) + "ms");
  layers.querySelectorAll(".wire").forEach((w, i) => w.style.animationDelay = (200 + i * 9) + "ms");
  requestAnimationFrame(() => svg.classList.add("loaded"));

  const legend = document.getElementById("legend");
  [["var(--n8n)","Trigger / n8n automation"],["var(--aws)","AWS infrastructure"],["var(--ai)","AI orchestration & LLM"],
   ["var(--artifact)","Generated artifact"],["var(--pub)","Publishing"],["var(--store)","Storage & observability"]]
   .forEach(([c, label]) => { const it = document.createElement("span"); it.className = "item"; const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = c; it.appendChild(sw); it.appendChild(document.createTextNode(label)); legend.appendChild(it); });

  const root = document.documentElement;
  document.getElementById("themetoggle").addEventListener("click", () => {
    const cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });
})();
</script>
